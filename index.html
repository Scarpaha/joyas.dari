  /* ==============================================================
     COMPARTIR: FLYER CON LA FOTO DE LA JOYA (HISTORIAS / FEED)
     --------------------------------------------------------------
     Objetivo: que la dueña de la tienda pueda publicar una pieza en
     historias sin diseñar nada. El flyer se dibuja en un <canvas> real
     de 1080 px de ancho (sin librerías externas, para no volver a cargar
     CDNs que se quitaron) y se exporta como PNG.

     Flujo:
       1. Click en el botón de la tarjeta -> openShare(id)
       2. refreshFlyer(): espera fuentes + carga la foto + dibuja + exporta
       3. El modal muestra el resultado y permite Compartir o Descargar.

     Las medidas y el recorte de texto están pensados para que un nombre
     o un detalle largo nunca empujen el precio fuera de cuadro.
     ============================================================== */

  /* Cada formato tiene su propio lienzo y sus propias medidas: no es la misma
     imagen escalada. Historia (9:16) y feed (4:5) necesitan otros márgenes,
     tamaños y topes de líneas para que el bloque de texto respire igual.
       nameMax/nameMin -> rango en el que el nombre se achica hasta caber
       nameLines/detailLines -> máximo de líneas antes de recortar con "…"
       brandTop -> altura de "JOYAS DARI". En historia va más abajo (250 px)
                  porque Instagram dibuja ahí el avatar/usuario y tapaba la
                  marca; en feed no hay ese overlay.
       bottom -> margen inferior donde se ancla el precio */
  const SHARE_FORMATS = {
    story: { w: 1080, h: 1920, margin: 88, brandTop: 250, bottom: 112, nameMax: 86, nameMin: 52, nameLines: 3, detailSize: 30, detailLines: 3, priceSize: 96, oldSize: 36 },
    feed:  { w: 1080, h: 1350, margin: 76, brandTop: 110, bottom: 94,  nameMax: 76, nameMin: 48, nameLines: 2, detailSize: 27, detailLines: 2, priceSize: 84, oldSize: 32 }
  };
  const SERIF = '"Playfair Display", Didot, Georgia, serif';
  const SANS = 'Archivo, "Segoe UI", Arial, sans-serif';

  // Estado del modal: producto abierto, formato elegido, PNG ya generado y
  // token para descartar generaciones viejas cuando se cambia de formato.
  let shareProduct = null, shareFormat = 'story', shareBlob = null, shareToken = 0;
  let shareImage = null, shareImageId = null;

  /* Nombre de archivo seguro: sin tildes ni espacios,
     ej. "joyas-dari-pulsera-eslabones.png". */
  function shareFileName(p) {
    const base = String(p && p.name || 'joya').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'joya';
    return 'joyas-dari-' + base + '.png';
  }

  /* La foto se pide a lh3.googleusercontent.com y NO al
     drive.google.com/thumbnail que usan las tarjetas: solo lh3 responde con
     cabeceras CORS. Sin CORS el canvas queda "contaminado" y el navegador
     bloquea toBlob()/toDataURL(), o sea, no se podría exportar el flyer.
     crossOrigin='anonymous' es obligatorio por el mismo motivo.
     Si la imagen falla, devuelve null y el flyer se dibuja con fondo oscuro
     (nunca se queda con un botón que no hace nada). */
  function loadShareImage(id) {
    if (!id) return Promise.resolve(null);
    return new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = 'https://lh3.googleusercontent.com/d/' + id + '=w1600';
    });
  }

  /* Cachea la foto ya cargada: al cambiar entre historia y feed se reutiliza
     en vez de volver a descargarla. Si el producto no tiene foto válida, usa
     la imagen por defecto del sitio. */
  async function ensureShareImage(p) {
    const id = driveIdFrom(p.img || '');
    const defId = driveIdFrom(CONFIG.defImg);
    const key = id || defId;
    if (shareImage && shareImageId === key) return shareImage;
    let img = id ? await loadShareImage(id) : null;
    if (!img && defId && defId !== id) img = await loadShareImage(defId);
    shareImage = img;
    shareImageId = key;
    return img;
  }

  /* canvas no aplica letter-spacing de forma confiable: para "JOYAS DARI" y
     el tipo dibujamos letra por letra con el espaciado que queramos.
     align 'center' centra el bloque completo (incluido el tracking) en x. */
  function trackText(ctx, text, x, y, spacing, align) {
    const chars = Array.from(String(text));
    let total = 0;
    for (let i = 0; i < chars.length; i++) {
      total += ctx.measureText(chars[i]).width + (i < chars.length - 1 ? spacing : 0);
    }
    let cx = align === 'center' ? x - total / 2 : x;
    const prev = ctx.textAlign;
    ctx.textAlign = 'left';
    for (let i = 0; i < chars.length; i++) {
      ctx.fillText(chars[i], cx, y);
      cx += ctx.measureText(chars[i]).width + spacing;
    }
    ctx.textAlign = prev;
  }

  /* Rectángulo redondeado a mano (para el badge de descuento). */
  function roundRectPath(ctx, x, y, w, h, r) {
    r = Math.min(r, h / 2, w / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* Parte el texto por palabras usando el ancho real medido en el canvas
     (no un número de caracteres estimado). */
  function wrapText(ctx, text, maxW) {
    const words = String(text || '').replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
    const lines = [];
    let cur = '';
    for (const w of words) {
      const next = cur ? cur + ' ' + w : w;
      if (!cur || ctx.measureText(next).width <= maxW) cur = next;
      else { lines.push(cur); cur = w; }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  /* Si el texto supera las líneas permitidas, recorta la última y le agrega
     "…". Así el bloque nunca se desborda ni corta una palabra a la mitad. */
  function clampLines(ctx, lines, maxLines, maxW) {
    if (lines.length <= maxLines) return lines.slice();
    const kept = lines.slice(0, maxLines);
    let last = kept[maxLines - 1];
    let cand = last + '…';
    while (ctx.measureText(cand).width > maxW && last.includes(' ')) {
      last = last.replace(/\s+\S*$/, '');
      cand = last + '…';
    }
    kept[maxLines - 1] = cand;
    return kept;
  }

  /* Dibuja el flyer completo.
     Estrategia: el bloque de texto se arma de abajo hacia arriba. El precio se
     ancla al margen inferior y el resto (detalle, nombre, tipo) crece hacia
     arriba según cuántas líneas ocupe. Así un nombre de 1, 2 o 3 líneas no
     empuja el precio fuera de cuadro ni pisa la marca de arriba. */
  function drawFlyer(p, fmt, img) {
    const F = SHARE_FORMATS[fmt] || SHARE_FORMATS.story;
    const W = F.w, H = F.h, M = F.margin, maxW = W - M * 2;
    shareCanvas.width = W;
    shareCanvas.height = H;
    const ctx = shareCanvas.getContext('2d');
    ctx.clearRect(0, 0, W, H);

    /* --- fondo: foto a sangre completa --- */
    if (img && img.naturalWidth) {
      // Recorte tipo object-fit: cover, centrado: llena el lienzo sin deformar.
      const ir = img.naturalWidth / img.naturalHeight, cr = W / H;
      let dw, dh;
      if (ir > cr) { dh = H; dw = H * ir; } else { dw = W; dh = W / ir; }
      ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
    } else {
      // Sin foto: fondo oscuro con un halo frío de la marca para que el flyer no salga vacío.
      ctx.fillStyle = '#12181A';
      ctx.fillRect(0, 0, W, H);
      const rg = ctx.createRadialGradient(W * 0.35, H * 0.3, 0, W * 0.35, H * 0.3, H * 0.85);
      rg.addColorStop(0, '#264A4E');
      rg.addColorStop(1, '#0E1214');
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, W, H);
    }

    /* --- velo superior --- */
    // Deliberadamente tenue (.42 y no más): solo separa "JOYAS DARI" del fondo.
    // Antes era más denso y apagaba la parte alta de la foto, justo donde suele
    // estar la joya.
    let g = ctx.createLinearGradient(0, 0, 0, H * 0.18);
    g.addColorStop(0, 'rgba(8,10,12,.42)');
    g.addColorStop(1, 'rgba(8,10,12,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H * 0.18);

    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';

    /* --- marca --- */
    // Centrada. brandTop (no el margen): en historias Instagram pinta su
    // usuario/avatar arriba y tapaba "JOYAS DARI". Por eso baja a 250 px en 9:16.
    const brandTop = F.brandTop;
    ctx.fillStyle = 'rgba(255,255,255,.94)';
    ctx.font = '600 ' + Math.round(W * 0.024) + 'px ' + SANS;
    // Sombra suave: a esta altura el velo superior ya es tenue y la marca
    // tiene que leerse igual sobre fotos claras.
    ctx.shadowColor = 'rgba(0,0,0,.45)';
    ctx.shadowBlur = 18;
    trackText(ctx, 'JOYAS DARI', W / 2, brandTop, 8, 'center');
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.32)';
    // Debajo y con aire: al centrar la marca, una línea pegada al texto
    // quedaba justo en el espacio entre "JOYAS" y "DARI".
    ctx.fillRect(W / 2 - 28, brandTop + 32, 56, 2);

    /* --- precios --- */
    const isOffer = hasOffer(p);
    const priceText = formatPrice(isOffer ? p.oferta : p.price);
    const oldText = isOffer ? formatPrice(p.price) : '';
    const badge = isOffer ? discountLabel(p) : '';

    // Si el precio es muy largo, baja el tamaño de letra antes que salirse del
    // ancho. Se reserva espacio a la derecha cuando hay badge de descuento.
    let priceSize = F.priceSize;
    ctx.font = '700 ' + priceSize + 'px ' + SANS;
    const reserve = badge ? 170 : 0;
    while (ctx.measureText(priceText).width > maxW - reserve && priceSize > 46) {
      priceSize -= 2;
      ctx.font = '700 ' + priceSize + 'px ' + SANS;
    }
    const priceBase = H - F.bottom;

    /* --- bloque inferior: de abajo hacia arriba --- */
    // priceTop estima la altura visual del bloque de precio para ubicar la
    // línea divisoria y, sobre ella, el detalle y el nombre.
    const priceTop = isOffer
      ? priceBase - priceSize * 0.95 - F.oldSize * 0.8
      : priceBase - priceSize * 0.75;
    const ruleY = Math.round(priceTop - 40);
    const oldBase = isOffer ? Math.round(priceBase - priceSize * 0.95) : 0;

    // Detalle: máximo de líneas por formato, recortado con "…" si sobra.
    const detailSize = F.detailSize;
    const detailLh = Math.round(detailSize * 1.5);
    ctx.font = '400 ' + detailSize + 'px ' + SANS;
    const detailLines = p.detail ? clampLines(ctx, wrapText(ctx, p.detail, maxW), F.detailLines, maxW) : [];
    const detailBases = [];
    let db = ruleY - 34;
    for (let i = detailLines.length - 1; i >= 0; i--) { detailBases[i] = db; db -= detailLh; }
    const detailTop = detailLines.length ? detailBases[0] - detailSize * 0.76 : ruleY - 34;
    // 36 px de aire entre el nombre y el detalle: con menos se veían pegados
    // cuando el nombre ocupaba dos líneas.
    const nameBottom = detailLines.length ? detailTop - 36 : ruleY - 46;

    // El nombre prueba tamaños de F.nameMax hacia abajo hasta caber en las
    // líneas permitidas. Es lo que evita que un nombre largo rompa el flyer.
    let nameSize = F.nameMax;
    let nameLines = [];
    for (;;) {
      ctx.font = '500 ' + nameSize + 'px ' + SERIF;
      nameLines = wrapText(ctx, p.name || 'Joya', maxW);
      if (nameLines.length <= F.nameLines || nameSize <= F.nameMin) break;
      nameSize -= 3;
    }
    nameLines = clampLines(ctx, nameLines, F.nameLines, maxW);
    const nameLh = Math.round(nameSize * 1.06);
    const nameBases = [];
    let nb = nameBottom;
    for (let i = nameLines.length - 1; i >= 0; i--) { nameBases[i] = nb; nb -= nameLh; }
    const nameTop = nameBases[0] - nameSize * 0.76;

    const typeSize = Math.round(W * 0.026);
    const typeBase = Math.round(nameTop - 34);

    /* --- velo inferior adaptativo --- */
    // Clave: se dibuja DESPUÉS de calcular el layout, así sabemos exactamente
    // dónde empieza el texto. Antes el degradado arrancaba a media foto (28%)
    // y apagaba la joya sin necesidad. Ahora nace justo sobre el tipo y solo
    // oscurece la franja que necesita contraste.
    const scrimTop = Math.max(0, typeBase - typeSize * 6);
    const gs = ctx.createLinearGradient(0, scrimTop, 0, H);
    gs.addColorStop(0, 'rgba(10,12,14,0)');
    gs.addColorStop(0.2, 'rgba(10,12,14,.58)');
    gs.addColorStop(0.55, 'rgba(10,12,14,.86)');
    gs.addColorStop(1, 'rgba(10,12,14,.95)');
    ctx.fillStyle = gs;
    ctx.fillRect(0, scrimTop, W, H - scrimTop);

    /* --- tipo --- */
    // Sombra suave en el texto: da contraste extra sobre fotos claras sin
    // seguir oscureciendo la imagen.
    ctx.shadowColor = 'rgba(0,0,0,.5)';
    ctx.shadowBlur = 26;
    ctx.shadowOffsetY = 2;
    // Hueso sobre el degradado oscuro: se lee sin competir con el blanco.
    ctx.fillStyle = '#E2CBA6';
    ctx.font = '600 ' + typeSize + 'px ' + SANS;
    trackText(ctx, String(p.type || 'JOYA').toUpperCase(), M, typeBase, Math.round(typeSize * 0.22));

    /* --- nombre --- */
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '500 ' + nameSize + 'px ' + SERIF;
    nameLines.forEach((ln, i) => ctx.fillText(ln, M, nameBases[i]));

    /* --- detalle --- */
    if (detailLines.length) {
      ctx.fillStyle = 'rgba(255,255,255,.74)';
      ctx.font = '400 ' + detailSize + 'px ' + SANS;
      detailLines.forEach((ln, i) => ctx.fillText(ln, M, detailBases[i]));
    }

    // La sombra solo era para el texto: se apaga antes de líneas y badge.
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    /* --- línea --- */
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    ctx.fillRect(M, ruleY, Math.min(120, maxW), 2);

    /* --- precio anterior tachado --- */
    if (isOffer) {
      ctx.font = '400 ' + F.oldSize + 'px ' + SANS;
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      const ow = ctx.measureText(oldText).width;
      ctx.fillText(oldText, M, oldBase);
      // Canvas no tiene text-decoration: el tachado se dibuja a mano,
      // centrado sobre la altura de las cifras.
      ctx.fillRect(M - 2, Math.round(oldBase - F.oldSize * 0.33), Math.round(ow + 4), Math.max(2, Math.round(F.oldSize * 0.07)));
    }

    /* --- precio principal --- */
    ctx.font = '700 ' + priceSize + 'px ' + SANS;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(priceText, M, priceBase);

    /* --- badge de descuento --- */
    if (badge) {
      const pw = ctx.measureText(priceText).width;
      const bFont = Math.round(priceSize * 0.3);
      ctx.font = '700 ' + bFont + 'px ' + SANS;
      const tw = ctx.measureText(badge).width;
      const padX = Math.round(bFont * 0.8);
      const bh = Math.round(bFont * 2.05);
      const bw = tw + padX * 2;
      const bx = M + pw + 26;
      const by = priceBase - bh + Math.round(bFont * 0.42);
      // Solo se pinta si cabe a la derecha del precio; si no, se omite
      // (mejor sin badge que con el badge fuera del lienzo).
      if (bx + bw <= W - M) {
        ctx.fillStyle = '#8E1226';
        roundRectPath(ctx, bx, by, bw, bh, bh / 2);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(badge, bx + padX, by + bh / 2 + bFont * 0.36);
      }
    }
  }

  /* Mientras el flyer se está dibujando, los botones quedan deshabilitados:
     si no, se podría descargar un canvas a medio pintar. */
  function setShareBusy(busy) {
    shareLoading.classList.toggle('show', busy);
    const off = busy || !shareBlob;
    if (shareNativeBtn) shareNativeBtn.disabled = off;
    if (shareDownloadBtn) shareDownloadBtn.disabled = off;
  }

  /* Espera a Playfair Display y Archivo antes de dibujar. Si no se espera,
     el canvas usa Georgia/Arial y el flyer sale con otra tipografía. */
  async function loadFlyerFonts() {
    if (!document.fonts || !document.fonts.load) return;
    try {
      await Promise.all([
        document.fonts.load('500 80px "Playfair Display"'),
        document.fonts.load('600 80px "Playfair Display"'),
        document.fonts.load('600 30px "Archivo"'),
        document.fonts.load('700 80px "Archivo"'),
        document.fonts.load('400 30px "Archivo"')
      ]);
      await document.fonts.ready;
    } catch (e) { /* usa las fuentes de respaldo */ }
  }

  /* Genera (o regenera) el flyer del producto actual.
     shareToken evita carreras: si la persona cambia de formato mientras se
     está cargando la foto, el resultado viejo se descarta y no pisa al nuevo. */
  async function refreshFlyer() {
    if (!shareProduct) return;
    const token = ++shareToken;
    shareBlob = null;
    setShareBusy(true);
    await loadFlyerFonts();
    const img = await ensureShareImage(shareProduct);
    if (token !== shareToken) return;
    drawFlyer(shareProduct, shareFormat, img);
    const blob = await new Promise(res => {
      try { shareCanvas.toBlob(b => res(b), 'image/png'); }
      catch (e) { res(null); }
    });
    if (token !== shareToken) return;
    shareBlob = blob;
    setShareBusy(false);
    if (!blob) showToast('No se pudo generar la imagen');
  }

  /* Abre el modal y arranca la generación.
     Igual que el carrito: bloquea el scroll de la página de fondo.
     "Compartir" solo se muestra si el navegador puede compartir archivos
     (Web Share API); en escritorio queda únicamente "Descargar". */
  async function openShare(pid) {
    const p = inventory.find(x => x.id === pid);
    if (!p) return;
    shareProduct = p;
    shareFormat = 'story';
    document.querySelectorAll('.share-fmt').forEach(b => b.classList.toggle('active', b.dataset.fmt === 'story'));
    if (shareNativeBtn) shareNativeBtn.style.display = (navigator.canShare && window.File) ? '' : 'none';
    shareModal.classList.add('show');
    document.body.style.overflow = 'hidden';
    setShareBusy(true);
    await refreshFlyer();
  }

  /* shareToken++ invalida cualquier dibujo en curso: al cerrar no queremos que
     una imagen pendiente termine escribiendo en el canvas del modal. */
  function closeShare() {
    shareModal.classList.remove('show');
    document.body.style.overflow = '';
    shareToken++;
    shareProduct = null;
    shareBlob = null;
  }

  /* Cambiar historia <-> feed vuelve a dibujar el mismo producto sin cerrar
     el modal. El botón activo se marca con la clase .active. */
  function setShareFormat(fmt) {
    if (!shareProduct || !SHARE_FORMATS[fmt] || fmt === shareFormat) return;
    shareFormat = fmt;
    document.querySelectorAll('.share-fmt').forEach(b => b.classList.toggle('active', b.dataset.fmt === fmt));
    refreshFlyer();
  }

  /* Descarga el PNG ya generado. Se libera la URL temporal después para no
     dejar el blob ocupando memoria. */
  function downloadFlyer() {
    if (!shareBlob || !shareProduct) return;
    const url = URL.createObjectURL(shareBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = shareFileName(shareProduct);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    showToast('Imagen descargada', 'success');
  }

  /* Web Share API con archivo: es lo que hace aparecer Instagram/WhatsApp en
     el menú del celular. Si el navegador no lo soporta, cae en descarga para
     que el botón nunca quede sin hacer nada. */
  async function shareFlyer() {
    if (!shareBlob || !shareProduct) return;
    const file = new File([shareBlob], shareFileName(shareProduct), { type: 'image/png' });
    if (!navigator.canShare || !navigator.canShare({ files: [file] })) { downloadFlyer(); return; }
    try {
      await navigator.share({ files: [file], title: 'Joyas Dari', text: shareProduct.name });
    } catch (e) {
      if (e && e.name !== 'AbortError') showToast('No se pudo abrir el menú de compartir');
    }
  }
  /* ============================================================== */

  async function loadData() {
    if (isLoading) return;
    isLoading = true;
    renderSkeletons();
    loadState();
    startPhraseCycle();
    try {
      const res = await fetch(CONFIG.apiUrl);
      if (!res.ok) throw new Error(`Error HTTP ${res.status}: ${res.statusText}`);
      let data;
      try { data = await res.json(); } catch (parseError) { throw new Error('La respuesta no es un JSON válido. Verifica la URL.'); }
      if (data.error) throw new Error(data.error);
      if (!data.productos) throw new Error('La respuesta no contiene "productos". Estructura: { productos: [...] }');
      if (!data.productos.length) {
        grid.innerHTML = `<div class="empty-state"><div class="empty-icon">◇</div><p class="empty-text">No hay productos disponibles</p></div>`;
        return;
      }
      tituloOferta = data.titulo_oferta || "Ofertas";

      const usedIds = new Set();
      inventory = data.productos.map((p, i) => {
        let rawId = p.ID || p.id || p.Código || p.Codigo || p.SKU || null;
        let id = rawId ? String(rawId).trim() : '';
        if (!id) { id = `PROD-${String(i + 1).padStart(3, '0')}`; }
        let uniqueId = id;
        let counter = 1;
        while (usedIds.has(uniqueId)) { uniqueId = `${id}-${counter}`; counter++; }
        usedIds.add(uniqueId);

        const ofertaVal = p.Oferta !== undefined ? p.Oferta : p.oferta;
        let oferta = null;
        if (ofertaVal !== undefined && ofertaVal !== null && ofertaVal !== '' && !isNaN(parseFloat(ofertaVal))) {
          const parsed = parseFloat(ofertaVal);
          if (parsed > 0) oferta = parsed;
        }
        return {
          id: uniqueId,
          type: p.Tipo || p.tipo || 'Otros',
          name: p.Contenido || p.contenido || '',
          stock: parseInt(p.Stock || p.stock || 0),
          price: parseInt(p.Precio || p.precio || 0),
          img: fixDriveUrl(p['Link de la Imagen'] || p.link_de_la_imagen || p.imagen || '', 400),
          detail: p.Detalles || p.detalles || p.Detalle || p.detalle || p.Descripción || p.descripcion || '',
          oferta: oferta
        };
      }).filter(p => p.id && p.name);

      if (!inventory.length) throw new Error('No se pudieron procesar productos válidos. Verifica los datos.');

      // Sincronizar precios del carrito guardado con la oferta vigente
      cart.forEach(item => {
        const p = inventory.find(x => x.id === item.id);
        if (p) {
          item.price = effectivePrice(p);
          item.name = p.name;
        }
      });
      if (cart.length) { saveState(); updateCartBar(); }

      renderCategories();
      renderCarousel();
      renderProducts();
    } catch (e) {
      console.error('Error en loadData:', e);
      showError(e.message || 'Error desconocido al cargar los datos', e.stack || 'Sin detalles adicionales');
    } finally {
      isLoading = false;
    }
  }

  // Funciones expuestas para los onclick inline del HTML (incluye el flyer).
  window.Dari = {
    openLightbox, closeLightbox, toggleFavorite, setCategory,
    changeQty, handleQtyInput, addToCart, addOneFromCarousel,
    addOneFromCarouselByIndex, imgFallback,
    updateCartBar, renderCartModal, updateCartItemQty, removeCartItem,
    openCartModal, closeCartModal, sendCartOrder, loadData,
    openShare, closeShare, setShareFormat, downloadFlyer, shareFlyer,
    showToast, showError, CONFIG
  };

  loadState();
  document.addEventListener('DOMContentLoaded', loadData);
})();
</script>
</body>
</html>
