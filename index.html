<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Joyas Dari · Catálogo</title>
  <link rel="icon" href="https://drive.google.com/thumbnail?id=1avUuzvlAKSWBiaSQ8td4Xgv1fsg4ebuf&sz=w32" type="image/png">
  <link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=1avUuzvlAKSWBiaSQ8td4Xgv1fsg4ebuf&sz=w180">
  <meta property="og:title" content="Joyas Dari · Joyas con estilo">
  <meta property="og:description" content="Catálogo de joyas únicas. Piezas hechas a mano con materiales de calidad.">
  <meta property="og:image" content="https://drive.google.com/thumbnail?id=1avUuzvlAKSWBiaSQ8td4Xgv1fsg4ebuf&sz=w1200">
  <meta property="og:type" content="website">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');
    :root{--dark:#282828;--teal:#15696F;--teal-light:#63BDB5;--muted:#858585;--bg:#EEF2F0;--white:#FFFFFF;--bordeaux:#880D1E;--silver:#E5E9EC}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{background:var(--bg);color:var(--dark);font-family:'Inter',system-ui,sans-serif;font-weight:400;line-height:1.5;overflow-x:hidden}

    .header{position:sticky;top:0;z-index:50;background:rgba(40,40,40,0.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;border-bottom:1px solid rgba(255,255,255,0.06)}
    .header-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;gap:10px}
    .logo-img{height:40px;width:auto;display:block}
    .brand-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;font-weight:500;letter-spacing:0.04em;text-align:center;color:#F1F5F9;flex:1;white-space:nowrap}
    .header-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
    .header-action-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.04);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;font-size:16px}
    .header-action-btn:hover{background:rgba(255,255,255,0.12);border-color:var(--teal-light)}
    .search-expandable{position:relative;display:flex;align-items:center;gap:6px;overflow:hidden;width:0;opacity:0;transition:width 0.3s cubic-bezier(0.22,1,0.36,1),opacity 0.25s ease;margin-left:0}
    .search-expandable.open{width:200px;opacity:1;margin-left:6px}
    .search-expandable input{width:100%;padding:7px 30px 7px 32px;border-radius:100px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:#fff;font-size:13px;outline:none;transition:all 0.2s}
    .search-expandable input::placeholder{color:rgba(255,255,255,0.4)}
    .search-expandable input:focus{background:rgba(255,255,255,0.12);border-color:var(--teal-light);box-shadow:0 0 0 3px rgba(99,189,181,0.25)}
    .search-expandable .search-icon-inner{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.45);pointer-events:none;font-size:14px}
    .search-expandable .search-close-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:0;border:0;color:rgba(255,255,255,0.5);font-size:18px;cursor:pointer;padding:2px}
    .tagline-container{text-align:center;padding:2px 16px 6px;min-height:32px;display:flex;align-items:center;justify-content:center}
    .tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:rgba(255,255,255,0.85);letter-spacing:0.04em;transition:opacity 0.3s;display:inline-block;min-height:1.5em}
    .tagline.typing::after{content:'|';animation:blink 0.7s step-end infinite;margin-left:2px;color:var(--teal-light);font-weight:300}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

    .categories{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
    .categories::-webkit-scrollbar{display:none}
    .cat-btn{flex-shrink:0;padding:6px 14px;border-radius:100px;border:1px solid rgba(255,255,255,0.15);background:0;color:rgba(255,255,255,0.85);font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:all 0.2s}
    .cat-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.25)}
    .cat-btn.active{background:var(--teal-light);color:var(--dark);border-color:var(--teal-light);font-weight:600}
    .cart-summary{display:none;align-items:center;justify-content:space-between;background:var(--teal);margin:0 12px 10px;padding:8px 14px;border-radius:100px;color:#fff;animation:fadeUp 0.25s ease;box-shadow:0 4px 16px rgba(21,105,111,0.25)}
    .cart-summary.show{display:flex}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    .carousel-wrapper{position:relative;padding:16px 0 20px;background:linear-gradient(180deg,#F4F7F5 0%, var(--bg) 100%);border-bottom:1px solid rgba(40,40,40,0.04);display:none;overflow:hidden}
    .carousel-wrapper.show{display:block}
    .carousel-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;color:var(--dark);padding:0 0 12px 16px;letter-spacing:0.02em}

    .ring-3d-stage{position:relative;width:100%;height:440px;perspective:1400px;perspective-origin:50% 50%;user-select:none;-webkit-user-select:none;touch-action:pan-y;cursor:grab;overflow:visible}
    .ring-3d-stage.dragging{cursor:grabbing}

    .ring-3d{position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform}

    .ring-3d-item{position:absolute;top:50%;left:50%;width:200px;height:360px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 12px 40px rgba(40,40,40,0.18), 0 2px 8px rgba(40,40,40,0.08);border:1px solid rgba(40,40,40,0.06);backface-visibility:hidden;display:flex;flex-direction:column;cursor:pointer;transform-origin:center center}
    .ring-3d-item.offer{border:2px solid var(--teal-light)}

    .ring-3d-img{position:relative;width:100%;height:190px;overflow:hidden;background:#E8ECE9;flex-shrink:0;cursor:zoom-in}
    .ring-3d-img img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}

    .ring-3d-badge{position:absolute;top:8px;left:8px;background:var(--bordeaux);color:#fff;font-size:9px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:0.08em;z-index:2}
    .ring-3d-stock{position:absolute;bottom:8px;left:8px;background:rgba(40,40,40,0.85);color:#fff;font-size:9px;font-weight:600;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;backdrop-filter:blur(4px)}
    .ring-3d-stock.low{background:var(--bordeaux)}

    .ring-3d-body{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1 1 auto;gap:4px;background:#fff;min-height:0}
    .ring-3d-type{font-size:9px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--teal);flex-shrink:0}
    .ring-3d-name{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:500;line-height:1.15;color:var(--dark);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px;max-height:36px;flex-shrink:0}
    .ring-3d-prices{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;flex-shrink:0;margin-top:auto;padding-top:4px}
    .ring-3d-price{font-size:15px;font-weight:700;color:var(--dark)}
    .ring-3d-price-old{font-size:11px;color:var(--muted);text-decoration:line-through}
    .ring-3d-price-offer{font-size:15px;font-weight:700;color:var(--bordeaux)}
    .ring-3d-add{width:100%;padding:8px;border:0;border-radius:100px;background:var(--dark);color:#fff;font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:all 0.2s;margin-top:6px;position:relative;z-index:5;flex-shrink:0}
    .ring-3d-add:hover:not(:disabled){background:var(--teal)}
    .ring-3d-add:disabled{background:#C5CBC8;cursor:not-allowed}

    .ring-controls{display:flex;justify-content:center;align-items:center;gap:14px;padding:16px 0 0}
    .ring-btn{width:38px;height:38px;border-radius:50%;background:var(--dark);color:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;line-height:1;transition:all 0.2s;box-shadow:0 4px 12px rgba(40,40,40,0.15)}
    .ring-btn:hover{background:var(--teal);transform:scale(1.06)}
    .ring-btn:active{transform:scale(0.96)}
    .ring-dots{display:flex;gap:6px;align-items:center}
    .ring-dot{width:8px;height:8px;border-radius:50%;background:var(--silver);border:0;padding:0;cursor:pointer;transition:all 0.25s}
    .ring-dot.active{background:var(--teal-light);width:22px;border-radius:4px}

    .ring-3d-stage.flat{height:auto;min-height:0;perspective:none;display:flex;justify-content:center;align-items:center;padding:8px 16px 4px}
    .ring-3d-stage.flat .ring-3d{transform:none !important;transform-style:flat;display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;height:auto;min-height:0}
    .ring-3d-stage.flat .ring-3d-item{position:relative;top:auto;left:auto;margin:0;transform:none !important;flex-shrink:0}

    @media (min-width:640px){
      .ring-3d-stage{height:500px;perspective:1600px}
      .ring-3d-item{width:220px;height:390px}
      .ring-3d-img{height:210px}
      .ring-3d-name{font-size:17px;min-height:40px;max-height:40px}
    }
    @media (min-width:1024px){
      .ring-3d-stage{height:620px;perspective:2000px}
      .ring-3d-item{width:260px;height:470px}
      .ring-3d-img{height:260px}
      .ring-3d-name{font-size:20px;min-height:48px;max-height:48px}
      .ring-3d-price,.ring-3d-price-offer{font-size:18px}
      .carousel-title{font-size:28px;padding-left:24px}
    }
    @media (min-width:1280px){
      .ring-3d-stage{height:660px;perspective:2200px}
      .ring-3d-item{width:280px;height:490px}
      .ring-3d-img{height:280px}
      .ring-3d-name{font-size:22px;min-height:52px;max-height:52px}
    }
    @media (max-width:480px){
      .ring-3d-stage{height:420px;perspective:1200px}
      .ring-3d-item{width:180px;height:340px}
      .ring-3d-img{height:170px}
      .ring-3d-name{font-size:14px;min-height:32px;max-height:32px}
      .ring-3d-price,.ring-3d-price-offer{font-size:13px}
      .carousel-title{font-size:20px}
      .ring-btn{width:34px;height:34px;font-size:18px}
    }

    .product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;padding:10px 4px 30px;margin:0}
    @media (min-width:640px){.product-grid{grid-template-columns:repeat(3,1fr);gap:4px;padding:12px 6px 40px}}
    @media (min-width:1024px){.product-grid{grid-template-columns:repeat(3,1fr);gap:12px;padding:24px 12px 50px}}
    @media (min-width:1280px){.product-grid{grid-template-columns:repeat(4,1fr);gap:16px;padding:32px 16px 60px}}

    .card{background:#fff;border-radius:8px;overflow:hidden;border:1px solid #E5E9EC;box-shadow:0 1px 2px rgba(40,40,40,0.03);transition:transform 0.25s ease,box-shadow 0.25s ease,border-color 0.2s;display:flex;flex-direction:column;margin-bottom:2px;position:relative;height:100%}
    @media (min-width:1024px){
      .card{border-radius:14px;border-color:#E5E9EC;box-shadow:0 2px 8px rgba(40,40,40,0.04);margin-bottom:0}
      .card:hover{transform:translateY(-6px);box-shadow:0 12px 32px rgba(40,40,40,0.08);border-color:var(--teal-light)}
    }
    .card.offer{border:2px solid var(--teal-light);background:#F8FDFC}
    .card.offer .card-body{background:#F8FDFC}
    .card.offer .card-price-row .original-price{text-decoration:line-through;color:var(--muted);font-size:12px;margin-right:6px}
    .card.offer .card-price-row .offer-price{color:var(--bordeaux);font-weight:700}
    .offer-badge{position:absolute;top:8px;left:8px;background:var(--bordeaux);color:#fff;font-size:8px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.06em;z-index:3}

    .card-image{position:relative;aspect-ratio:1/1;background:#E8ECE9;overflow:hidden}
    .card-image img{width:100%;height:100%;object-fit:cover;transition:transform 0.4s;cursor:zoom-in;display:block}
    .card-image img:hover{transform:scale(1.04)}
    .fav-btn{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.9);border:0;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.08);transition:all 0.15s;z-index:2}
    .fav-btn:hover{transform:scale(1.1)}
    .stock-badge{position:absolute;bottom:8px;left:8px;background:var(--bordeaux);color:#fff;font-size:8px;font-weight:600;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em}
    .stock-badge.low{background:var(--dark)}

    .card-body{padding:8px 8px 10px;display:flex;flex-direction:column;flex:1}
    @media (min-width:1024px){.card-body{padding:16px 16px 18px}}
    @media (min-width:1280px){.card-body{padding:20px 20px 22px}}

    .card-type{font-size:8px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--teal);margin-bottom:2px}
    @media (min-width:1024px){.card-type{font-size:11px;margin-bottom:6px}}

    .card-title{font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:500;line-height:1.2;color:var(--dark);margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    @media (min-width:1024px){.card-title{font-size:20px;margin-bottom:6px}}
    @media (min-width:1280px){.card-title{font-size:22px}}

    .card-detail{font-size:10px;color:var(--muted);font-weight:400;line-height:1.3;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    @media (min-width:1024px){.card-detail{font-size:13px;margin-bottom:8px}}

    .card-price-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;flex-wrap:wrap;gap:2px}
    .card-price{font-size:14px;font-weight:600;color:var(--dark)}
    @media (min-width:1024px){.card-price{font-size:20px}}
    @media (min-width:1280px){.card-price{font-size:22px}}
    .card-stock{font-size:9px;color:var(--muted)}
    @media (min-width:1024px){.card-stock{font-size:12px}}

    .qty-row{display:flex;align-items:center;gap:4px;margin-bottom:4px}
    @media (min-width:1024px){.qty-row{margin-bottom:10px}}

    .qty-control{display:flex;align-items:center;background:#E8ECE9;border-radius:100px;padding:2px}
    @media (min-width:1024px){.qty-control{padding:4px}}

    .qty-btn{width:24px;height:24px;border:0;background:#fff;border-radius:50%;font-size:12px;font-weight:500;color:var(--dark);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,0.04);transition:all 0.15s}
    .qty-btn:hover:not(:disabled){background:var(--silver)}
    .qty-btn:disabled{opacity:0.3;cursor:not-allowed}
    @media (min-width:1024px){.qty-btn{width:34px;height:34px;font-size:16px}}

    .qty-value{width:28px;text-align:center;border:0;background:0;font-size:12px;font-weight:600;color:var(--dark);outline:0;-moz-appearance:textfield}
    .qty-value::-webkit-outer-spin-button,.qty-value::-webkit-inner-spin-button{-webkit-appearance:none}
    @media (min-width:1024px){.qty-value{width:40px;font-size:16px}}

    .add-btn{width:100%;padding:6px;border:0;border-radius:100px;background:var(--dark);color:#fff;font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:all 0.2s;text-align:center}
    .add-btn:hover:not(:disabled){background:var(--teal)}
    .add-btn:disabled{background:#C5CBC8;cursor:not-allowed}
    @media (min-width:1024px){.add-btn{padding:12px;font-size:13px;letter-spacing:0.1em}}
    @media (min-width:1280px){.add-btn{padding:14px;font-size:14px}}

    .empty-state{grid-column:1/-1;text-align:center;padding:50px 16px}
    .empty-icon{font-size:40px;margin-bottom:10px}
    .empty-text{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--muted)}
    .skeleton-card{background:#fff;border-radius:8px;overflow:hidden}
    .skeleton{background:linear-gradient(90deg,#E0E5E2 25%,#EEF2F0 50%,#E0E5E2 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .skeleton-img{aspect-ratio:1/1}
    .skeleton-line{height:10px;border-radius:6px;margin:8px 12px}

    .cart-modal{display:none;position:fixed;inset:0;background:rgba(40,40,40,0.5);backdrop-filter:blur(4px);z-index:100;align-items:flex-end;justify-content:center}
    .cart-modal.show{display:flex}
    .cart-panel{background:#fff;width:100%;max-width:420px;max-height:80vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:slideUp 0.3s cubic-bezier(0.22,1,0.36,1);box-shadow:0 -8px 30px rgba(0,0,0,0.08)}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .cart-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid #E5E9EC}
    .cart-header h3{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;color:var(--dark)}
    .cart-close{width:32px;height:32px;border-radius:50%;border:0;background:#EEF2F0;font-size:20px;color:var(--dark);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s}
    .cart-close:hover{background:#E0E5E2}
    .cart-items{flex:1;overflow-y:auto;padding:6px 16px}
    .cart-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #EEF2F0;gap:10px}
    .cart-item:last-child{border-bottom:0}
    .cart-item-info{flex:1;min-width:0}
    .cart-item-name{font-weight:500;font-size:13px;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
    .cart-item-price{font-size:11px;color:var(--muted)}
    .cart-item-actions{display:flex;align-items:center;gap:6px}
    .cart-qty{display:flex;align-items:center;background:#EEF2F0;border-radius:100px;padding:2px}
    .cart-qty-btn{width:26px;height:26px;border:0;background:#fff;border-radius:50%;font-size:14px;font-weight:500;color:var(--dark);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,0.04);transition:all 0.15s}
    .cart-qty-btn:hover{background:var(--silver)}
    .cart-qty-input{width:30px;text-align:center;border:0;background:0;font-size:13px;font-weight:600;outline:0;color:var(--dark)}
    .cart-delete{width:30px;height:30px;border-radius:50%;border:0;background:#FDF2F2;color:var(--bordeaux);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
    .cart-delete:hover{background:#FEE2E2;transform:scale(1.04)}
    .cart-footer{padding:14px 18px 24px;border-top:1px solid #E5E9EC;background:#F8FAF9}
    .cart-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .cart-total-label{font-size:14px;color:var(--muted)}
    .cart-total-amount{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--dark)}
    .whatsapp-btn{width:100%;padding:12px;border:0;border-radius:100px;background:var(--teal);color:#fff;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;transition:all 0.2s}
    .whatsapp-btn:hover{background:#12575C}

    .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:200;align-items:center;justify-content:center;cursor:zoom-out;overflow:hidden;user-select:none}
    .lightbox.show{display:flex}
    .lightbox .lightbox-inner{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .lightbox img{max-width:95vw;max-height:90vh;width:auto;height:auto;object-fit:contain;border-radius:6px;box-shadow:0 16px 48px rgba(0,0,0,0.4);transition:transform 0.1s;touch-action:none;cursor:zoom-in}
    .lightbox img.zoomed{cursor:zoom-out}
    .lightbox-close{position:absolute;top:16px;right:20px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.4);color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;backdrop-filter:blur(6px);z-index:10}
    .lightbox-close:hover{background:rgba(255,255,255,0.15)}
    .lightbox .zoom-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.3);font-size:11px;font-family:'Inter',sans-serif;letter-spacing:0.02em;pointer-events:none;background:rgba(0,0,0,0.2);padding:4px 14px;border-radius:20px;backdrop-filter:blur(4px)}
    .toast-container{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;pointer-events:none}
    .toast{background:var(--dark);color:#fff;padding:10px 20px;border-radius:100px;font-size:12px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,0.15);animation:toastIn 0.3s ease;white-space:nowrap}
    .toast.success{background:var(--teal)}
    .toast.error{background:var(--bordeaux)}
    @keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .footer{background:var(--dark);padding:24px 16px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
    .social-btn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:#E8EEF4;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;text-decoration:none}
    .social-btn:hover{background:var(--teal-light);color:var(--dark);border-color:var(--teal-light);transform:scale(1.06)}
    .card-enter{animation:cardIn 0.35s cubic-bezier(0.22,1,0.36,1) both}
    @keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .bounce{animation:bounce 0.35s cubic-bezier(0.34,1.56,0.64,1)}
    @keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.15)}}
    @media (min-width:1024px){
      .header-top{padding:16px 24px 8px}
      .logo-img{height:50px}
      .brand-title{font-size:32px;letter-spacing:0.06em}
      .header-action-btn{width:44px;height:44px;font-size:20px}
      .search-expandable.open{width:280px}
      .search-expandable input{padding:10px 36px 10px 40px;font-size:15px}
      .tagline{font-size:16px}
      .cat-btn{padding:8px 20px;font-size:12px}
      .categories{padding:0 16px 12px;gap:10px}
      .cart-summary{margin:0 16px 10px;padding:10px 18px}
    }
    @media (min-width:1280px){
      .header-top{padding:20px 32px 10px}
      .logo-img{height:56px}
      .brand-title{font-size:36px}
      .search-expandable.open{width:320px}
    }
    @media (max-width:480px){
      .header-top{padding:10px 10px 2px}
      .logo-img{height:34px}
      .brand-title{font-size:20px;letter-spacing:0.02em}
      .search-expandable.open{width:140px}
      .tagline{font-size:12px}
      .lightbox img{max-width:98vw;max-height:85vh}
      .lightbox-close{top:10px;right:14px;width:36px;height:36px;font-size:20px}
      .product-grid{gap:2px;padding:8px 2px 20px}
      .card-body{padding:6px 6px 8px}
      .card-title{font-size:13px}
      .card-price{font-size:13px}
      .add-btn{font-size:9px;padding:5px}
    }
    @media (min-width:768px){
      .header-top{padding:14px 20px 6px}
      .brand-title{font-size:28px}
      .logo-img{height:44px}
      .search-expandable.open{width:260px}
      .lightbox img{max-width:90vw;max-height:85vh}
    }
    @media (prefers-reduced-motion: reduce){
      .ring-3d,.ring-3d-item,.card{transition:none!important;animation:none!important}
    }
  </style>
</head>

    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>

<div id="lightbox" class="lightbox">

  </div>
  <div class="zoom-hint">🔍 Rueda · Doble clic</div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script>
(function(){
  "use strict";

  const CONFIG = {
    apiUrl: 'https://script.google.com/macros/s/AKfycbzVgoeVshhknH9Oe_a8LHagxOPmSZO5XTuWbeT-ovOKg3WJ90uwZ6of3PuulVuNysE8/exec',
    ws: '56933634348',
    defImg: 'https://drive.google.com/thumbnail?id=1avUuzvlAKSWBiaSQ8td4Xgv1fsg4ebuf&sz=w400',
    STORAGE_CART: 'dari_cart',
    STORAGE_FAVS: 'dari_favs'
  };

  const frases = [
    "La elegancia es un estado de ánimo.",
    "Estilo que habla por sí solo.",
    "La belleza está en los detalles.",
    "Viste tu esencia con elegancia.",
    "Donde el estilo encuentra el alma.",
    "Elegancia sin esfuerzo.",
    "La plata como segunda piel.",
    "Brilla con tu propia luz.",
  ];

  let inventory = [], cart = [], favorites = [];
  let currentCategory = "TODOS";
  let searchQuery = '';
  let searchDebounce = null;
  let isLoading = false;
  let tituloOferta = "Ofertas";

  const $ = id => document.getElementById(id);
  const grid = $('grid');
  const catContainer = $('catContainer');
  const cartSummary = $('cartSummary');
  const cartCountDisplay = $('cartCountDisplay');
  const cartModal = $('cartModal');
  const cartModalItems = $('cartModalItems');
  const modalTotal = $('modalTotalAmount');
  const searchToggle = $('searchToggleBtn');
  const searchExpand = $('searchExpandable');
  const searchInput = $('searchInput');
  const searchClose = $('searchCloseBtn');
  const lightbox = $('lightbox');
  const lightboxImg = $('lightboxImg');
  const lightboxClose = $('lightboxCloseBtn');
  const lightboxInner = $('lightboxInner');
  const toastContainer = $('toastContainer');
  const tagline = $('tagline');
  const carouselWrapper = $('carouselWrapper');
  const carouselTitle = $('carouselTitle');
  const ringStage = $('ringStage');
  const ring3d = $('ring3d');
  const ringPrev = $('ringPrev');
  const ringNext = $('ringNext');
  const ringDots = $('ringDots');
  const ringControls = $('ringControls');

  // MÁQUINA DE ESCRIBIR
  let typeTimer = null, phraseCycleInterval = null;
  function startPhraseCycle(){ if (phraseCycleInterval) clearTimeout(phraseCycleInterval); setRandomPhrase(true); }
  function setRandomPhrase(cycle = false){
    if (frases.length === 0) return;
    if (typeTimer) { clearTimeout(typeTimer); typeTimer = null; }
    if (phraseCycleInterval) { clearTimeout(phraseCycleInterval); phraseCycleInterval = null; }
    let randomIndex, currentText = tagline.textContent.trim();
    if (frases.length > 1) { do { randomIndex = Math.floor(Math.random() * frases.length); } while (frases[randomIndex] === currentText); }
    else { randomIndex = 0; }
    const phrase = frases[randomIndex];
    tagline.textContent = ''; tagline.classList.add('typing');
    let i = 0;
    function typeChar(){
      if (i < phrase.length) { tagline.textContent = phrase.substring(0, i + 1); i++; typeTimer = setTimeout(typeChar, 70); }
      else { tagline.textContent = phrase; tagline.classList.remove('typing'); if (cycle) { phraseCycleInterval = setTimeout(() => { setRandomPhrase(true); }, 4000); } }
    }
    typeChar();
  }

  function showError(message, errorDetails = null) {
    console.error('Error:', message, errorDetails);
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <p class="empty-text" style="font-size:14px;color:#880D1E;font-weight:600;">Error al cargar</p>
        <p style="font-size:12px;color:#666;margin:8px 0;max-width:300px;margin-left:auto;margin-right:auto;">${message}</p>
        ${errorDetails ? `<p style="font-size:10px;color:#999;margin:4px 0;max-width:300px;margin-left:auto;margin-right:auto;word-break:break-all;">${errorDetails}</p>` : ''}
        <button onclick="Dari.loadData()" style="margin-top:12px;padding:8px 20px;border:1px solid #C5CBC8;border-radius:100px;background:#fff;cursor:pointer;font-size:12px;">Reintentar</button>
      </div>
    `;
    showToast(`❌ ${message}`, 'error');
  }

  // LIGHTBOX
  let currentScale = 1, translateX = 0, translateY = 0, isDragging = false;
  let startX, startY, startTranslateX, startTranslateY;
  function openLightbox(src, alt) {
    if (!src || src === CONFIG.defImg) return;
    const highRes = src.replace(/&sz=w\d+/, '&sz=w1200');
    lightboxImg.src = highRes; lightboxImg.alt = alt || 'Joya';
    resetZoom(); lightbox.classList.add('show'); document.body.style.overflow = 'hidden';
  }
  function closeLightbox() { lightbox.classList.remove('show'); document.body.style.overflow = ''; resetZoom(); }
  function resetZoom() {
    currentScale = 1; translateX = 0; translateY = 0;
    lightboxImg.style.transform = 'scale(1) translate(0px,0px)';
    lightboxImg.classList.remove('zoomed'); lightbox.style.cursor = 'zoom-out';
  }
  lightbox.addEventListener('click', e => { if (e.target === lightbox || e.target === lightboxInner || e.target === lightboxImg) closeLightbox(); });
  lightboxClose.addEventListener('click', e => { e.stopPropagation(); closeLightbox(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeLightbox(); closeCartModal(); } });
  lightboxImg.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.08 : 0.08;
    let newScale = Math.min(3, Math.max(0.5, currentScale + delta));
    if (newScale !== currentScale) {
      currentScale = newScale;
      lightboxImg.style.transform = `scale(${currentScale}) translate(${translateX}px, ${translateY}px)`;
      lightboxImg.classList.toggle('zoomed', currentScale > 1);
      lightbox.style.cursor = currentScale > 1 ? 'zoom-in' : 'zoom-out';
    }
  }, { passive: false });
  lightboxImg.addEventListener('dblclick', e => {
    e.preventDefault();
    if (currentScale > 1) resetZoom();
    else { currentScale = 1.5; lightboxImg.style.transform = 'scale(1.5) translate(0,0)'; lightboxImg.classList.add('zoomed'); lightbox.style.cursor = 'zoom-in'; }
  });
  lightboxImg.addEventListener('mousedown', e => {
    if (currentScale <= 1) return;
    isDragging = true; startX = e.clientX; startY = e.clientY;
    startTranslateX = translateX; startTranslateY = translateY;
    lightboxImg.style.cursor = 'grabbing'; e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!isDragging) return;
    translateX = startTranslateX + (e.clientX - startX);
    translateY = startTranslateY + (e.clientY - startY);
    lightboxImg.style.transform = `scale(${currentScale}) translate(${translateX}px, ${translateY}px)`;
  });
  document.addEventListener('mouseup', () => { isDragging = false; lightboxImg.style.cursor = currentScale > 1 ? 'zoom-in' : 'zoom-out'; });

  // UTILIDADES
  function escapeHtml(str) { const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
  function sanitize(str) { return str ? escapeHtml(String(str)).trim() : ''; }
  function formatPrice(n) { return '$' + n.toLocaleString('es-CL'); }
  function fixDriveUrl(url, size = 400) {
    if (!url || url.length < 10) return CONFIG.defImg;
    const m = url.match(/(?:id=|d\/|file\/d\/)([\w-]{25,})/);
    return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w${size}` : CONFIG.defImg;
  }
  function showToast(msg, type = '') {
    const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
    toastContainer.appendChild(t); setTimeout(() => t.remove(), 2400);
  }
  function saveState() {
    try { localStorage.setItem(CONFIG.STORAGE_CART, JSON.stringify(cart));
          localStorage.setItem(CONFIG.STORAGE_FAVS, JSON.stringify(favorites)); } catch(e){}
  }
  function loadState() {
    try { const c = localStorage.getItem(CONFIG.STORAGE_CART); if (c) cart = JSON.parse(c);
          const f = localStorage.getItem(CONFIG.STORAGE_FAVS); if (f) favorites = JSON.parse(f); } catch(e){}
  }
  function debounce(fn, delay) { return function(...args) { clearTimeout(searchDebounce); searchDebounce = setTimeout(() => fn.apply(this, args), delay); }; }

  // BÚSQUEDA
  function openSearch() { searchExpand.classList.add('open'); searchInput.focus(); }
  function closeSearch() { searchExpand.classList.remove('open'); searchInput.value = ''; searchQuery = ''; renderProducts(); renderCarousel(); }
  searchToggle.addEventListener('click', e => { e.stopPropagation(); if (searchExpand.classList.contains('open')) closeSearch(); else openSearch(); });
  searchClose.addEventListener('click', e => { e.stopPropagation(); closeSearch(); });
  document.addEventListener('click', e => { const inside = searchExpand.contains(e.target) || searchToggle.contains(e.target); if (!inside && searchExpand.classList.contains('open')) closeSearch(); });
  const handleSearch = debounce(function() { searchQuery = searchInput.value.toLowerCase().trim(); renderProducts(); renderCarousel(); }, 200);
  searchInput.addEventListener('input', handleSearch);
  searchInput.addEventListener('keydown', e => { if (e.key === 'Escape') closeSearch(); });

  // FAVORITOS
  function isFavorite(id) { return favorites.includes(id); }
  function toggleFavorite(pid) {
    const i = favorites.indexOf(pid);
    if (i >= 0) { favorites.splice(i,1); showToast('Eliminado de favoritos'); } else { favorites.push(pid); showToast('Añadido a favoritos','success'); }
    saveState();
    const btn = document.getElementById('fav-'+pid);
    if (btn) btn.innerHTML = isFavorite(pid) ? '❤️' : '🤍';
  }

  // CATEGORÍAS
  function renderCategories() {
    const types = ["TODOS", ...new Set(inventory.map(p => p.type).filter(Boolean))];
    catContainer.innerHTML = types.map(t =>
      `<button class="cat-btn ${currentCategory===t?'active':''}" onclick="Dari.setCategory('${encodeURIComponent(t)}')">${sanitize(t)}</button>`
    ).join('');
  }
  function setCategory(cat) { currentCategory = decodeURIComponent(cat); renderCategories(); renderProducts(); renderCarousel(); }

  // CANTIDAD
  function changeQty(pid, delta) {
    const input = document.getElementById('qty-'+pid);
    const p = inventory.find(x => x.id === pid);
    if (!input || !p) return;
    let v = parseInt(input.value) || 1;
    v = Math.max(1, Math.min(v + delta, p.stock));
    input.value = v; updateAddBtn(pid, v, p.stock);
  }
  function handleQtyInput(pid) {
    const input = document.getElementById('qty-'+pid);
    const p = inventory.find(x => x.id === pid);
    if (!input || !p) return;
    let v = parseInt(input.value);
    if (isNaN(v) || v < 1) v = 1;
    if (v > p.stock) v = p.stock;
    input.value = v; updateAddBtn(pid, v, p.stock);
  }
  function updateAddBtn(pid, qty, stock) {
    const btn = document.getElementById('add-btn-'+pid);
    if (btn) btn.disabled = qty > stock || stock <= 0;
  }

  // CARRUSEL 3D
  const AUTO_SPEED        = 0.06;
  const SCROLL_MULT       = 0.22;
  const EASING            = 0.045;
  const AUTO_RESUME_MS    = 5000;
  const DRAG_SENSITIVITY  = 0.35;
  const MOMENTUM_FRICTION = 0.93;
  const SNAP_THRESHOLD    = 0.05;
  const INIT_DELAY_MS     = 600;
  const DRAG_THRESHOLD    = 6;
  const FRONT_ANGLE_MAX   = 22;

  let carouselProducts = [];
  let ringRotation = 0;
  let ringTargetRotation = 0;
  let ringAutoRotate = false;
  let ringReady = false;
  let ringAnimFrame = null;
  let ringIndex = 0;
  let autoRotateTimer = null;

  let ringDragging = false;
  let didDrag = false;
  let downX = 0, downY = 0;
  let dragStartPointerX = 0, dragStartPointerY = 0;
  let ringStartX = 0;
  let ringStartRotation = 0;
  let ringLastX = 0;
  let ringLastTime = 0;
  let ringVelocity = 0;
  let ringMomentumFrame = null;
  let ringIsFlat = false;

  function renderCarousel() {
    const show = (currentCategory === "TODOS" && searchQuery === '');
    if (!show) {
      carouselWrapper.classList.remove('show');
      stopRing();
      return;
    }
    const offerItems = inventory.filter(p => p.oferta !== null && p.oferta !== undefined && p.oferta !== '' && !isNaN(p.oferta) && p.oferta > 0);
    if (offerItems.length === 0) {
      carouselWrapper.classList.remove('show');
      stopRing();
      return;
    }

    carouselWrapper.classList.add('show');
    carouselTitle.textContent = tituloOferta || "Ofertas";
    carouselProducts = offerItems;

    ringReady = false;
    buildRing(offerItems);
    buildRingDots(offerItems);
    startRing();
  }

  function computeRadius(n) {
    const w = window.innerWidth;
    const baseR = w < 480 ? 240 : w < 640 ? 280 : w < 1024 ? 340 : w < 1280 ? 400 : 440;
    const scale = n <= 4 ? 0.9 : n <= 6 ? 1 : n <= 8 ? 1.1 : 1.2;
    return baseR * scale;
  }

  function buildRing(items) {
    const n = items.length;
    const stage = ringStage;
    const ring = ring3d;

    if (n <= 2) {
      ringIsFlat = true;
      stage.classList.add('flat');
      ringControls.style.display = 'none';
      ring.innerHTML = items.map((p, i) => createRingItemHtml(p, i, 0, 0, false)).join('');
      attachRingHandlers();
      return;
    }

    ringIsFlat = false;
    stage.classList.remove('flat');
    ringControls.style.display = 'flex';

    const radius = computeRadius(n);
    const anglePerItem = 360 / n;

    ring.innerHTML = items.map((p, i) => {
      const itemAngle = i * anglePerItem;
      return createRingItemHtml(p, i, itemAngle, radius, true);
    }).join('');

    attachRingHandlers();
  }

  function createRingItemHtml(p, i, itemAngle, radius, use3d) {
    const imgSrc = fixDriveUrl(p.img, 500);
    const isOffer = p.oferta !== null && p.oferta !== undefined && p.oferta !== '' && !isNaN(p.oferta) && p.oferta > 0;
    const out = p.stock <= 0, low = p.stock > 0 && p.stock <= 5;

    const priceHtml = isOffer
      ? `<span class="ring-3d-price-old">${formatPrice(p.price)}</span><span class="ring-3d-price-offer">${formatPrice(p.oferta)}</span>`
      : `<span class="ring-3d-price">${formatPrice(p.price)}</span>`;

    const transform = use3d
      ? `transform: translate(-50%, -50%) rotateY(${itemAngle}deg) translateZ(${radius}px);`
      : '';

    return `
      <article class="ring-3d-item ${isOffer?'offer':''}"
               data-index="${i}"
               style="${transform}">
        <div class="ring-3d-img">
          <img src="${imgSrc}" alt="${sanitize(p.name)}" loading="lazy" decoding="async"
               onerror="this.onerror=null; this.src='${CONFIG.defImg}';">
          ${isOffer ? '<span class="ring-3d-badge">Oferta</span>' : ''}
          ${out ? '<span class="ring-3d-stock">Vendido</span>' : low ? `<span class="ring-3d-stock low">Solo ${p.stock}</span>` : ''}
        </div>
        <div class="ring-3d-body">
          <span class="ring-3d-type">${sanitize(p.type)}</span>
          <h3 class="ring-3d-name">${sanitize(p.name)}</h3>
          <div class="ring-3d-prices">${priceHtml}</div>
          <button type="button" class="ring-3d-add" data-add-index="${i}" ${out?'disabled':''}>
            ${out?'Vendido':'Añadir 1'}
          </button>
        </div>
      </article>
    `;
  }

  function attachRingHandlers() {
    // El listener del botón se mantiene para clicks DIRECTOS (cuando el botón
    // está al frente y el puntero cae directamente sobre él).
    // Para botones "tapados" por otras tarjetas, se resuelve en handleClickAt.
    ring3d.querySelectorAll('.ring-3d-add').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        e.preventDefault();
        if (didDrag) return;
        const idx = parseInt(this.dataset.addIndex);
        addOneFromCarouselByIndex(idx);
      });
    });
  }

  function buildRingDots(items) {
    if (items.length <= 2) { ringDots.innerHTML = ''; return; }
    ringDots.innerHTML = items.map((_, i) =>
      `<button class="ring-dot ${i===0?'active':''}" data-index="${i}" aria-label="Ir al producto ${i+1}"></button>`
    ).join('');
    ringDots.querySelectorAll('.ring-dot').forEach(dot => {
      dot.addEventListener('click', function() {
        goToRingIndex(parseInt(this.dataset.index));
      });
    });
  }

  function goToRingIndex(i) {
    const n = carouselProducts.length;
    if (!n || ringIsFlat) return;
    ringIndex = ((i % n) + n) % n;
    const anglePerItem = 360 / n;
    ringTargetRotation = -ringIndex * anglePerItem;
    ringAutoRotate = false;
    restartAutoRotateTimer();
    updateRingDots();
  }

  function updateRingDots() {
    if (ringIsFlat) return;
    ringDots.querySelectorAll('.ring-dot').forEach((d, i) => {
      d.classList.toggle('active', i === ringIndex);
    });
  }

  function startRing() {
    ringRotation = 0;
    ringTargetRotation = 0;
    ringIndex = 0;
    ringAutoRotate = false;
    ringReady = false;
    updateRingDots();

    if (ringAnimFrame) cancelAnimationFrame(ringAnimFrame);
    if (ringMomentumFrame) cancelAnimationFrame(ringMomentumFrame);
    if (autoRotateTimer) clearTimeout(autoRotateTimer);

    if (ringIsFlat) { ringReady = true; return; }

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function loop() {
      if (ringReady && !reduced && ringAutoRotate && !ringDragging) {
        ringTargetRotation -= AUTO_SPEED;
      }
      ringRotation += (ringTargetRotation - ringRotation) * EASING;
      if (ringRotation > 360) { ringRotation -= 360; ringTargetRotation -= 360; }
      if (ringRotation < 0)   { ringRotation += 360; ringTargetRotation += 360; }
      ring3d.style.transform = `rotateY(${ringRotation}deg)`;

      const n = carouselProducts.length;
      if (ringReady && n > 2) {
        const anglePerItem = 360 / n;
        let bestI = 0, bestDist = 999;
        for (let i = 0; i < n; i++) {
          let a = (i * anglePerItem + ringRotation) % 360;
          if (a < 0) a += 360;
          const dist = Math.min(a, 360 - a);
          if (dist < bestDist) { bestDist = dist; bestI = i; }
        }
        if (bestI !== ringIndex) { ringIndex = bestI; updateRingDots(); }
      }
      ringAnimFrame = requestAnimationFrame(loop);
    }
    loop();

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        ringReady = true;
        setTimeout(() => { if (!ringDragging) ringAutoRotate = true; }, INIT_DELAY_MS);
      });
    });
  }

  function stopRing() {
    if (ringAnimFrame) { cancelAnimationFrame(ringAnimFrame); ringAnimFrame = null; }
    if (ringMomentumFrame) { cancelAnimationFrame(ringMomentumFrame); ringMomentumFrame = null; }
    if (autoRotateTimer) { clearTimeout(autoRotateTimer); autoRotateTimer = null; }
    ringReady = false;
    ringAutoRotate = false;
  }

  function restartAutoRotateTimer() {
    if (autoRotateTimer) clearTimeout(autoRotateTimer);
    autoRotateTimer = setTimeout(() => {
      if (ringReady && !ringDragging && !ringIsFlat) ringAutoRotate = true;
    }, AUTO_RESUME_MS);
  }

  // ===== HIT-TEST MANUAL =====
  function getCardAngle(i) {
    const n = carouselProducts.length;
    if (!n) return 0;
    const anglePerItem = 360 / n;
    let a = (i * anglePerItem + ringRotation) % 360;
    if (a < 0) a += 360;
    return Math.min(a, 360 - a);
  }

  function handleClickAt(x, y) {
    const stack = document.elementsFromPoint(x, y);
    if (!stack || !stack.length) return;

    // PASO 1: Buscar cualquier botón "Añadir 1" en la pila (aunque esté tapado).
    // Si lo encontramos, se procesa y se termina. Esto es lo que arregla
    // que los botones de las tarjetas 2 y 4 (laterales) funcionen.
    for (const el of stack) {
      if (!el.classList) continue;
      if (el.classList.contains('ring-dot')) return;
      if (el.classList.contains('ring-3d-add')) {
        if (el.disabled) return;
        const idx = parseInt(el.dataset.addIndex);
        if (!isNaN(idx)) addOneFromCarouselByIndex(idx);
        return;
      }
    }

    // PASO 2: No hay botón. Buscar la primera tarjeta y decidir:
    //   - Si está al frente → abrir lightbox.
    //   - Si está lateral o atrás → girar hacia ella.
    for (const el of stack) {
      if (!el.closest) continue;
      const card = el.closest('.ring-3d-item');
      if (card) {
        const i = parseInt(card.dataset.index);
        if (isNaN(i)) return;
        const p = carouselProducts[i];
        if (!p) return;

        const distToFront = getCardAngle(i);

        if (distToFront < FRONT_ANGLE_MAX) {
          openLightbox(fixDriveUrl(p.img, 1200), p.name);
        } else {
          goToRingIndex(i);
        }
        return;
      }
    }
  }

  // ===== DRAG =====
  function onPointerDown(e) {
    if (!carouselProducts.length || !ringReady || ringIsFlat) return;
    if (e.target.closest('button, a, input, select, textarea, .ring-dot')) return;

    const p = e.touches ? e.touches[0] : e;
    ringDragging = true;
    didDrag = false;
    downX = p.clientX;
    downY = p.clientY;
    dragStartPointerX = p.clientX;
    dragStartPointerY = p.clientY;
    ringStartX = p.clientX;
    ringStartRotation = ringRotation;
    ringTargetRotation = ringRotation;
    ringLastX = ringStartX;
    ringLastTime = performance.now();
    ringVelocity = 0;
    ringStage.classList.add('dragging');
  }

  function onPointerMove(e) {
    if (!ringDragging) return;
    const p = e.touches ? e.touches[0] : e;
    const x = p.clientX;
    const y = p.clientY;

    if (!didDrag) {
      const dx0 = Math.abs(x - dragStartPointerX);
      const dy0 = Math.abs(y - dragStartPointerY);
      if (dx0 > DRAG_THRESHOLD || dy0 > DRAG_THRESHOLD) {
        didDrag = true;
        ringAutoRotate = false;
        if (autoRotateTimer) { clearTimeout(autoRotateTimer); autoRotateTimer = null; }
        if (e.pointerId !== undefined && ringStage.setPointerCapture) {
          try { ringStage.setPointerCapture(e.pointerId); } catch(_) {}
        }
      } else {
        return;
      }
    }

    const dx = x - ringStartX;
    const newRot = ringStartRotation + dx * DRAG_SENSITIVITY;
    ringRotation = newRot;
    ringTargetRotation = newRot;
    const now = performance.now();
    const dt = now - ringLastTime || 16;
    ringVelocity = (x - ringLastX) / dt;
    ringLastX = x;
    ringLastTime = now;
  }

  function onPointerUp(e) {
    if (!ringDragging) return;
    const wasDrag = didDrag;
    ringDragging = false;
    ringStage.classList.remove('dragging');

    if (wasDrag) {
      if (Math.abs(ringVelocity) > SNAP_THRESHOLD) {
        let v = ringVelocity * 10;
        function momentum() {
          v *= MOMENTUM_FRICTION;
          ringRotation += v;
          ringTargetRotation = ringRotation;
          if (Math.abs(v) > 0.25) ringMomentumFrame = requestAnimationFrame(momentum);
          else snapToNearest();
        }
        momentum();
      } else snapToNearest();
      restartAutoRotateTimer();
      setTimeout(() => { didDrag = false; }, 0);
    } else {
      didDrag = false;
      handleClickAt(downX, downY);
    }
  }

  function snapToNearest() {
    const n = carouselProducts.length;
    if (!n || ringIsFlat) return;
    const anglePerItem = 360 / n;
    const snapped = Math.round(ringRotation / anglePerItem) * anglePerItem;
    ringTargetRotation = snapped;
    let norm = ((snapped % 360) + 360) % 360;
    ringIndex = Math.round(norm / anglePerItem) % n;
    updateRingDots();
  }

  if (window.PointerEvent) {
    ringStage.addEventListener('pointerdown', onPointerDown);
    ringStage.addEventListener('pointermove', onPointerMove);
    ringStage.addEventListener('pointerup', onPointerUp);
    ringStage.addEventListener('pointercancel', onPointerUp);
  } else {
    ringStage.addEventListener('touchstart', onPointerDown, { passive: true });
    ringStage.addEventListener('touchmove', onPointerMove, { passive: true });
    ringStage.addEventListener('touchend', onPointerUp);
    ringStage.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
  }

  ringPrev.addEventListener('click', () => {
    const n = carouselProducts.length;
    if (!n || !ringReady || ringIsFlat) return;
    ringAutoRotate = false;
    const anglePerItem = 360 / n;
    ringTargetRotation = ringRotation + anglePerItem;
    restartAutoRotateTimer();
  });
  ringNext.addEventListener('click', () => {
    const n = carouselProducts.length;
    if (!n || !ringReady || ringIsFlat) return;
    ringAutoRotate = false;
    const anglePerItem = 360 / n;
    ringTargetRotation = ringRotation - anglePerItem;
    restartAutoRotateTimer();
  });

  let lastScrollY = window.scrollY;
  let scrollRafPending = false;
  window.addEventListener('scroll', () => {
    if (!carouselProducts.length || !ringReady || ringDragging || ringIsFlat) return;
    if (scrollRafPending) return;
    scrollRafPending = true;
    requestAnimationFrame(() => {
      const dy = window.scrollY - lastScrollY;
      lastScrollY = window.scrollY;
      if (Math.abs(dy) > 1) {
        ringAutoRotate = false;
        ringTargetRotation -= dy * SCROLL_MULT;
        restartAutoRotateTimer();
      }
      scrollRafPending = false;
    });
  }, { passive: true });

  let resizeTimeout;
  let lastInnerWidth = window.innerWidth;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      if (Math.abs(window.innerWidth - lastInnerWidth) < 5) return;
      lastInnerWidth = window.innerWidth;
      if (carouselProducts.length) {
        const savedRotation = ringRotation;
        const savedTarget = ringTargetRotation;
        buildRing(carouselProducts);
        ringRotation = savedRotation;
        ringTargetRotation = savedTarget;
      }
    }, 200);
  });

  // RENDER PRODUCTOS
  function renderProducts() {
    let list = currentCategory === "TODOS" ? [...inventory] : inventory.filter(p => p.type === currentCategory);
    if (searchQuery) {
      list = list.filter(p => (p.name && p.name.toLowerCase().includes(searchQuery)) ||
                              (p.type && p.type.toLowerCase().includes(searchQuery)) ||
                              (p.id && p.id.toLowerCase().includes(searchQuery)));
    }
    if (!list.length) {
      grid.innerHTML = `<div class="empty-state"><div class="empty-icon">${searchQuery?'🔍':'💎'}</div><p class="empty-text">${searchQuery?'No se encontraron resultados':'No hay productos en esta categoría'}</p></div>`;
      return;
    }
    let html = '';
    list.forEach((p) => { html += createProductCardHtml(p); });
    grid.innerHTML = html;
    list.forEach(p => {
      const inp = document.getElementById('qty-'+p.id);
      if (inp) updateAddBtn(p.id, parseInt(inp.value)||1, p.stock);
    });
  }

  function createProductCardHtml(p) {
    const out = p.stock <= 0, low = p.stock > 0 && p.stock <= 5;
    const fav = isFavorite(p.id);
    const imgSrc = fixDriveUrl(p.img, 400);
    const nameEnc = encodeURIComponent(p.name);
    const idEnc = encodeURIComponent(p.id);
    const isOffer = p.oferta !== null && p.oferta !== undefined && p.oferta !== '' && !isNaN(p.oferta) && p.oferta > 0;
    const offerClass = isOffer ? 'offer' : '';
    const badgeOffer = isOffer ? `<div class="offer-badge">OFERTA</div>` : '';

    let priceHtml = isOffer
      ? `<span class="original-price">${formatPrice(p.price)}</span><span class="offer-price">${formatPrice(p.oferta)}</span>`
      : `<span class="card-price">${formatPrice(p.price)}</span>`;

    const bodyHtml = `
      <div class="card-body">
        <p class="card-type">${sanitize(p.type)}</p>
        <h3 class="card-title">${sanitize(p.name)}</h3>
        ${p.detail ? `<p class="card-detail">Detalles: ${sanitize(p.detail)}</p>` : ''}
        <div class="card-price-row">
          ${priceHtml}
          <span class="card-stock">${out?'Sin stock':'Stock: '+p.stock}</span>
        </div>
        <div class="qty-row">
          <div class="qty-control">
            <button class="qty-btn" onclick="Dari.changeQty('${idEnc}',-1)" ${out?'disabled':''}>–</button>
            <input type="number" id="qty-${p.id}" class="qty-value" value="1" min="1" max="${p.stock}"
                   oninput="Dari.handleQtyInput('${idEnc}')" ${out?'disabled':''}>
            <button class="qty-btn" onclick="Dari.changeQty('${idEnc}',1)" ${out?'disabled':''}>+</button>
          </div>
        </div>
        <button id="add-btn-${p.id}" class="add-btn" onclick="Dari.addToCart('${idEnc}')" ${out?'disabled':''}>${out?'Vendido':'Añadir'}</button>
      </div>
    `;

    const extraHtml = `
      <button id="fav-${p.id}" class="fav-btn" onclick="event.stopPropagation();Dari.toggleFavorite('${idEnc}')">${fav?'❤️':'🤍'}</button>
      ${out ? '<span class="stock-badge">Vendido</span>' : low ? `<span class="stock-badge low">Solo ${p.stock}</span>` : ''}
    `;

    const cardClass = `card ${offerClass} card-enter`;
    const delay = Math.min(parseInt(p.id?.slice(-3) || '0'), 15) * 0.04;

    return `
      <article class="${cardClass}" style="animation-delay:${delay}s">
        <div class="card-image">
          <img src="${imgSrc}" alt="${sanitize(p.name)}" loading="lazy" decoding="async"
               onclick="Dari.openLightbox('${imgSrc}','${nameEnc}')"
               onerror="this.onerror=null; this.src='${CONFIG.defImg}';">
          ${badgeOffer}
          ${extraHtml}
        </div>
        ${bodyHtml}
      </article>
    `;
  }

  // CARRITO
  function addToCart(pid) {
    const p = inventory.find(x => x.id === pid);
    if (!p || p.stock <= 0) return;
    const qty = parseInt(document.getElementById('qty-'+pid).value) || 1;
    if (qty > p.stock) { showToast('Solo hay '+p.stock+' unidades','error'); return; }
    const exist = cart.find(i => i.id === pid);
    if (exist) { if (exist.q + qty > p.stock) { showToast('Máximo '+p.stock,'error'); return; } exist.q += qty; }
    else cart.push({ id: p.id, name: p.name, price: p.price, q: qty });
    updateCartBar(); saveState(); showToast('Añadido al carrito','success');
    const badge = cartCountDisplay;
    badge.classList.remove('bounce'); void badge.offsetWidth; badge.classList.add('bounce');
  }

  function addOneFromCarouselByIndex(idx) {
    const p = carouselProducts[idx];
    if (!p) { showToast('Producto no encontrado','error'); return; }
    if (p.stock <= 0) { showToast('Sin stock','error'); return; }
    const exist = cart.find(i => i.id === p.id);
    if (exist) {
      if (exist.q + 1 > p.stock) { showToast('Máximo '+p.stock,'error'); return; }
      exist.q += 1;
    } else {
      cart.push({ id: p.id, name: p.name, price: p.price, q: 1 });
    }
    updateCartBar(); saveState(); showToast('Añadido al carrito','success');
    const badge = cartCountDisplay;
    badge.classList.remove('bounce'); void badge.offsetWidth; badge.classList.add('bounce');
  }

  function addOneFromCarousel(pid) {
    const p = inventory.find(x => x.id === pid);
    if (!p) { showToast('Producto no encontrado','error'); return; }
    if (p.stock <= 0) { showToast('Sin stock','error'); return; }
    const exist = cart.find(i => i.id === pid);
    if (exist) {
      if (exist.q + 1 > p.stock) { showToast('Máximo '+p.stock,'error'); return; }
      exist.q += 1;
    } else {
      cart.push({ id: p.id, name: p.name, price: p.price, q: 1 });
    }
    updateCartBar(); saveState(); showToast('Añadido al carrito','success');
    const badge = cartCountDisplay;
    badge.classList.remove('bounce'); void badge.offsetWidth; badge.classList.add('bounce');
  }

  function updateCartBar() {
    const total = cart.reduce((s,i) => s + i.q, 0);
    cartCountDisplay.textContent = total + (total === 1 ? ' item' : ' items');
    cartSummary.classList.toggle('show', total > 0);
    renderCartModal();
  }

  function renderCartModal() {
    if (!cart.length) {
      cartModalItems.innerHTML = `<div class="empty-state" style="padding:30px 0"><div class="empty-icon">🛒</div><p class="empty-text">Vacío</p></div>`;
      modalTotal.textContent = '$0'; return;
    }
    let total = 0, html = '';
    cart.forEach((item, idx) => {
      total += item.price * item.q;
      html += `
      <div class="cart-item">
        <div class="cart-item-info"><div class="cart-item-name">${sanitize(item.name)}</div><div class="cart-item-price">${formatPrice(item.price)} c/u</div></div>
        <div class="cart-item-actions">
          <div class="cart-qty">
            <button class="cart-qty-btn" onclick="Dari.updateCartItemQty(${idx},-1)">−</button>
            <input type="number" class="cart-qty-input" value="${item.q}" min="1" oninput="Dari.updateCartItemQty(${idx},0,true)" id="cart-qty-${idx}">
            <button class="cart-qty-btn" onclick="Dari.updateCartItemQty(${idx},1)">+</button>
          </div>
          <button class="cart-delete" onclick="Dari.removeCartItem(${idx})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>
        </div>
      </div>`;
    });
    cartModalItems.innerHTML = html;
    modalTotal.textContent = formatPrice(total);
  }

  function updateCartItemQty(idx, delta, fromInput) {
    const item = cart[idx];
    const p = inventory.find(x => x.id === item.id);
    if (!p) return;
    let q = fromInput ? parseInt(document.getElementById('cart-qty-'+idx).value) : item.q + delta;
    if (isNaN(q) || q < 1) q = 1;
    if (p.stock && q > p.stock) { showToast('Máximo '+p.stock,'error'); q = p.stock; }
    item.q = q; updateCartBar(); saveState();
  }

  function removeCartItem(idx) {
    const name = cart[idx]?.name || 'Producto';
    cart.splice(idx, 1);
    updateCartBar(); saveState(); showToast(name + ' eliminado');
    if (!cart.length) closeCartModal();
  }

  function openCartModal() { cartModal.classList.add('show'); renderCartModal(); document.body.style.overflow = 'hidden'; }
  function closeCartModal() { cartModal.classList.remove('show'); document.body.style.overflow = ''; }

  function sendCartOrder() {
    if (!cart.length) return;
    const items = cart.map(i => `${i.q} x ${i.id} ${i.name}`).join('\n');
    const msg = `Hola Joyas Dari. Me interesa comprar:\n\n${items}\n\nEspero su respuesta...`;
    window.open(`https://wa.me/${CONFIG.ws}?text=${encodeURIComponent(msg)}`,'_blank');
  }

  function renderSkeletons() {
    grid.innerHTML = Array(8).fill('').map(() => `
      <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line" style="width:40%"></div><div class="skeleton skeleton-line" style="width:80%"></div><div class="skeleton skeleton-line" style="width:50%;height:14px;margin-top:12px"></div></div>
    `).join('');
  }

  async function loadData() {
    if (isLoading) return;
    isLoading = true;
    renderSkeletons();
    loadState();
    startPhraseCycle();
    try {
      const res = await fetch(CONFIG.apiUrl);
      if (!res.ok) throw new Error(`Error HTTP ${res.status}: ${res.statusText}`);
      let data;
      try { data = await res.json(); } catch (parseError) { throw new Error('La respuesta no es un JSON válido. Verifica la URL.'); }
      if (data.error) throw new Error(data.error);
      if (!data.productos) throw new Error('La respuesta no contiene "productos". Estructura: { productos: [...] }');
      if (!data.productos.length) {
        grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><p class="empty-text">No hay productos disponibles</p></div>`;
        return;
      }
      tituloOferta = data.titulo_oferta || "Ofertas";

      const usedIds = new Set();
      inventory = data.productos.map((p, i) => {
        let rawId = p.ID || p.id || p.Código || p.Codigo || p.SKU || null;
        let id = rawId ? String(rawId).trim() : '';
        if (!id) { id = `PROD-${String(i + 1).padStart(3, '0')}`; }
        let uniqueId = id;
        let counter = 1;
        while (usedIds.has(uniqueId)) { uniqueId = `${id}-${counter}`; counter++; }
        usedIds.add(uniqueId);

        const ofertaVal = p.Oferta !== undefined ? p.Oferta : p.oferta;
        let oferta = null;
        if (ofertaVal !== undefined && ofertaVal !== null && ofertaVal !== '' && !isNaN(parseFloat(ofertaVal))) {
          oferta = parseFloat(ofertaVal);
        }
        return {
          id: uniqueId,
          type: p.Tipo || p.tipo || 'Otros',
          name: p.Contenido || p.contenido || '',
          stock: parseInt(p.Stock || p.stock || 0),
          price: parseInt(p.Precio || p.precio || 0),
          img: fixDriveUrl(p['Link de la Imagen'] || p.link_de_la_imagen || p.imagen || '', 400),
          detail: p.Detalles || p.detalles || p.Detalle || p.detalle || p.Descripción || p.descripcion || '',
          oferta: oferta
        };
      }).filter(p => p.id && p.name);

      if (!inventory.length) throw new Error('No se pudieron procesar productos válidos. Verifica los datos.');
      renderCategories();
      renderCarousel();
      renderProducts();
      if (cart.length) updateCartBar();
    } catch (e) {
      console.error('Error en loadData:', e);
      showError(e.message || 'Error desconocido al cargar los datos', e.stack || 'Sin detalles adicionales');
    } finally {
      isLoading = false;
    }
  }

  window.Dari = {
    openLightbox, closeLightbox, toggleFavorite, setCategory,
    changeQty, handleQtyInput, addToCart, addOneFromCarousel,
    addOneFromCarouselByIndex,
    updateCartBar, renderCartModal, updateCartItemQty, removeCartItem,
    openCartModal, closeCartModal, sendCartOrder, loadData,
    showToast, showError, CONFIG
  };

  loadState();
  document.addEventListener('DOMContentLoaded', loadData);
})();
</script>
</body>
</html>
