<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1C1C1E">
  <meta name="description" content="Catálogo de joyas únicas de Joyas Dari. Piezas con materiales de calidad.">
  <title>Joyas Dari · Catálogo</title>
  <link rel="icon" href="https://drive.google.com/thumbnail?id=1avUuzvlAKSWBiaSQ8td4Xgv1fsg4ebuf&sz=w32" type="image/png">
  <link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=1avUuzvlAKSWBiaSQ8td4Xgv1fsg4ebuf&sz=w180">
  <meta property="og:title" content="Joyas Dari · Joyas con estilo">
  <meta property="og:description" content="Catálogo de joyas únicas. Piezas con materiales de calidad.">
  <meta property="og:image" content="https://drive.google.com/thumbnail?id=1avUuzvlAKSWBiaSQ8td4Xgv1fsg4ebuf&sz=w1200">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://drive.google.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap">
  <style>
    :root{
      --dark:#26262A;--ink:#20242A;--teal:#15696F;--teal-light:#63BDB5;
      --muted:#8C8A85;--bg:#F6F4EF;--white:#FFFFFF;--bordeaux:#8E1226;
      --silver:#E8EAE6;--line:rgba(32,36,42,.08);--fan-cw:180px;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:400;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    img{display:block}
    button{font-family:inherit}

    /* ============ HEADER ============ */
    .header{position:sticky;top:0;z-index:50;color:#F5F2EC;background:linear-gradient(180deg,#1C1C1E 0%,#26262A 100%);border-bottom:1px solid rgba(255,255,255,.07);box-shadow:0 12px 30px -18px rgba(20,20,22,.55)}
    .header-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 6px;max-width:1400px;margin:0 auto}
    .logo-badge{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
    .logo-img{height:100%;width:100%;object-fit:cover}
    .brand-block{flex:1;min-width:0;text-align:center;line-height:1.1}
    .brand-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;font-weight:500;letter-spacing:.06em;color:#F7F4EE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .header-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
    .header-action-btn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#F5F2EC;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .22s,border-color .22s,transform .22s}
    .header-action-btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
    .header-action-btn:active{transform:scale(.94)}
    .cart-badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:999px;background:var(--teal-light);color:#10292A;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid #232326}
    .cart-badge.show{display:flex}

    .search-expandable{position:relative;display:flex;align-items:center;overflow:hidden;width:0;opacity:0;transition:width .32s cubic-bezier(.22,1,.36,1),opacity .24s ease}
    .search-expandable.open{width:190px;opacity:1;margin-left:2px}
    .search-expandable input{width:100%;padding:8px 30px 8px 32px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;font-size:13px;outline:none;transition:background .2s,border-color .2s,box-shadow .2s}
    .search-expandable input::placeholder{color:rgba(255,255,255,.42)}
    .search-expandable input:focus{background:rgba(255,255,255,.12);border-color:var(--teal-light);box-shadow:0 0 0 3px rgba(99,189,181,.22)}
    .search-expandable .search-icon-inner{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.45);pointer-events:none;font-size:14px;display:flex}
    .search-expandable .search-close-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:0;border:0;color:rgba(255,255,255,.5);font-size:18px;line-height:1;cursor:pointer;padding:4px}

    .tagline-container{text-align:center;padding:2px 16px 8px;min-height:30px;display:flex;align-items:center;justify-content:center}
    .tagline{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:13px;color:rgba(247,244,238,.82);letter-spacing:.05em;display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.4em}
    .tagline.typing::after{content:'|';animation:blink .7s step-end infinite;margin-left:2px;color:var(--teal-light);font-weight:300}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

    .categories{display:flex;gap:7px;overflow-x:auto;padding:0 14px 11px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .categories::-webkit-scrollbar{display:none}
    .cat-btn{flex-shrink:0;padding:7px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);color:rgba(247,244,238,.72);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .22s,color .22s,border-color .22s}
    .cat-btn:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.24)}
    .cat-btn.active{background:var(--teal-light);color:#12292A;border-color:var(--teal-light);font-weight:600}
    .cat-btn.offers.active{background:var(--bordeaux);border-color:var(--bordeaux);color:#fff}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    /* ============ CARRUSEL FAN ============ */
    .carousel-wrapper{position:relative;display:none;padding:22px 0 12px;background:radial-gradient(120% 90% at 50% 0%,#FFFDF9 0%,#F6F4EF 58%,#F1EDE5 100%);border-bottom:1px solid var(--line);overflow:hidden}
    .carousel-wrapper.show{display:block;animation:fadeUp .45s ease both}
    .carousel-head{text-align:center;padding:0 16px 2px}
    .carousel-eyebrow{font-size:9px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--teal);opacity:.85}
    .carousel-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(23px,4.4vw,32px);font-weight:500;color:var(--ink);letter-spacing:.01em;margin-top:3px;line-height:1.15}
    .carousel-sub{font-size:10.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:4px}

    .fan-stage{position:relative;width:100%;height:380px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
    .fan-stage:focus{outline:none}
    .fan-stage:focus-visible{outline:2px solid var(--teal-light);outline-offset:-2px}
    .fan-stage.dragging{cursor:grabbing}
    .fan-layout{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.22,1,.36,1);will-change:transform}
    .fan-stage.dragging .fan-layout{transition:none}

    .fan-card{
      position:absolute;top:0;left:calc(50% - var(--fan-cw) / 2);
      width:var(--fan-cw);
      font-size:clamp(11px, calc(var(--fan-cw) * .083), 17px);
      border-radius:16px;overflow:hidden;background:#fff;
      border:1px solid rgba(32,36,42,.07);
      box-shadow:0 20px 40px -16px rgba(32,36,42,.34),0 4px 12px rgba(32,36,42,.06);
      display:flex;flex-direction:column;
      transform-origin:50% 100%;
      transition:transform .52s cubic-bezier(.22,1,.36,1),opacity .34s ease,box-shadow .3s ease;
      will-change:transform,opacity;
      backface-visibility:hidden;
      cursor:pointer;
    }
    .fan-card.offer{box-shadow:0 18px 36px -18px rgba(32,36,42,.3),0 0 0 1.5px rgba(142,18,38,.18),0 4px 12px rgba(32,36,42,.05)}
    .fan-card:focus-visible{outline:2px solid var(--teal-light);outline-offset:-2px}

    .fan-card-img{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:#EDEDE9;flex-shrink:0}
    .fan-card-img img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
    .fan-card-badge{position:absolute;top:.55em;left:.55em;background:var(--bordeaux);color:#fff;font-size:.56em;font-weight:700;padding:.26em .7em;border-radius:999px;text-transform:uppercase;letter-spacing:.1em;z-index:2;box-shadow:0 4px 12px rgba(142,18,38,.3)}
    .fan-card-stock{position:absolute;bottom:.55em;left:.55em;background:rgba(32,36,42,.86);color:#fff;font-size:.54em;font-weight:600;padding:.26em .7em;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;z-index:2;backdrop-filter:blur(4px)}
    .fan-card-stock.low{background:var(--bordeaux)}

    .fan-card-body{padding:.8em .85em .9em;display:flex;flex-direction:column;gap:.3em;background:#fff}
    .fan-card-type{font-size:.55em;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
    .fan-card-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.08em;font-weight:500;line-height:1.15;color:var(--ink);height:2.3em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .fan-card-prices{display:flex;align-items:baseline;gap:.3em;flex-wrap:nowrap;overflow:hidden;min-height:1.3em;margin-top:.05em}
    .fan-card-price{font-size:.98em;font-weight:700;color:var(--ink);letter-spacing:-.01em}
    .fan-card-price-old{font-size:.68em;color:var(--muted);text-decoration:line-through;font-weight:400}
    .fan-card-price-offer{font-size:1em;font-weight:700;color:var(--bordeaux)}
    .fan-card-add{display:flex;align-items:center;justify-content:center;gap:.45em;width:100%;margin-top:.4em;padding:.62em;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:.58em;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .24s,transform .18s}
    .fan-card-add::before{content:'+';font-size:1.1em;line-height:1;font-weight:500;margin-top:-.05em}
    .fan-card-add:hover:not(:disabled){background:var(--teal)}
    .fan-card-add:active:not(:disabled){transform:scale(.97)}
    .fan-card-add:disabled{background:#C7CBC6;cursor:not-allowed}
    .fan-card-add:disabled::before{content:none}

    .fan-controls{display:flex;justify-content:center;align-items:center;gap:12px;padding:16px 0 0}
    .fan-btn{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;transition:background .22s,color .22s,transform .18s,box-shadow .22s;box-shadow:0 8px 20px -10px rgba(32,36,42,.4)}
    .fan-btn:hover{background:var(--ink);color:#fff;transform:translateY(-1px)}
    .fan-btn:active{transform:scale(.94)}
    .fan-btn:focus-visible{outline:2px solid var(--teal-light);outline-offset:2px}
    .fan-dots{display:flex;gap:5px;align-items:center;max-width:52vw;overflow-x:auto;scrollbar-width:none;padding:2px}
    .fan-dots::-webkit-scrollbar{display:none}
    .fan-dot{width:6px;height:6px;border-radius:999px;background:rgba(32,36,42,.18);border:0;padding:0;cursor:pointer;transition:all .28s cubic-bezier(.22,1,.36,1);flex-shrink:0}
    .fan-dot.active{background:var(--teal);width:20px}
    .fan-counter{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.14em;white-space:nowrap}

    /* ============ SECCIÓN / GRID ============ */
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:24px 16px 8px;max-width:1400px;margin:0 auto}
    .section-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(20px,3.4vw,28px);font-weight:500;color:var(--ink);line-height:1.1}
    .section-count{font-size:9.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding-bottom:3px;white-space:nowrap}

    .product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px 40px;margin:0;max-width:1400px;margin-inline:auto}
    @media (min-width:640px){.product-grid{grid-template-columns:repeat(3,1fr);gap:14px;padding:0 16px 48px}}
    @media (min-width:1024px){.product-grid{gap:20px;padding:0 24px 56px}}

    .card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 26px -18px rgba(32,36,42,.35);display:flex;flex-direction:column;position:relative;height:100%;transition:transform .32s ease,box-shadow .32s ease}
    @media (hover:hover) and (min-width:768px){
      .card:hover{transform:translateY(-4px);box-shadow:0 22px 44px -20px rgba(32,36,42,.38)}
    }
    .card.offer{border-color:rgba(142,18,38,.22)}
    .card.offer .card-price-row .original-price{text-decoration:line-through;color:var(--muted);font-size:11px;margin-right:5px;font-weight:400}
    .card.offer .card-price-row .offer-price{color:var(--bordeaux);font-weight:700}
    .offer-badge{position:absolute;top:9px;left:9px;background:var(--bordeaux);color:#fff;font-size:8px;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.1em;z-index:3;box-shadow:0 4px 10px rgba(142,18,38,.28)}

    .card-image{position:relative;aspect-ratio:1/1;background:#EDEDE9;overflow:hidden}
    .card-image img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.22,1,.36,1);cursor:zoom-in}
    @media (hover:hover){.card-image img:hover{transform:scale(1.045)}}
    .fav-btn{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);border:0;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;box-shadow:0 3px 10px rgba(32,36,42,.12);transition:transform .18s,background .18s;z-index:2;backdrop-filter:blur(4px)}
    .fav-btn:hover{transform:scale(1.08)}
    .share-btn{position:absolute;bottom:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);border:0;display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;box-shadow:0 3px 10px rgba(32,36,42,.12);transition:transform .18s,background .18s;z-index:2;backdrop-filter:blur(4px)}
    .share-btn:hover{transform:scale(1.08);background:#fff}
    .share-btn svg{width:13px;height:13px}
    .stock-badge{position:absolute;bottom:8px;left:8px;background:var(--bordeaux);color:#fff;font-size:8px;font-weight:600;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.08em}
    .stock-badge.low{background:rgba(32,36,42,.88)}

    .card-body{padding:9px 10px 11px;display:flex;flex-direction:column;flex:1}
    @media (min-width:768px){.card-body{padding:13px 14px 15px}}
    @media (min-width:1024px){.card-body{padding:16px 16px 18px}}

    .card-type{font-size:8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:3px}
    @media (min-width:1024px){.card-type{font-size:10px;margin-bottom:5px}}

    .card-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:14.5px;font-weight:500;line-height:1.18;color:var(--ink);margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.36em}
    @media (min-width:768px){.card-title{font-size:17px}}
    @media (min-width:1024px){.card-title{font-size:20px;min-height:2.36em}}

    .card-detail{font-size:9.5px;color:var(--muted);font-weight:400;line-height:1.35;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    @media (min-width:1024px){.card-detail{font-size:12px;margin-bottom:8px}}

    .card-price-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:auto;margin-bottom:5px;flex-wrap:wrap;gap:2px 6px}
    .card-price{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
    @media (min-width:768px){.card-price{font-size:17px}}
    @media (min-width:1024px){.card-price{font-size:20px}}
    .card-stock{font-size:8.5px;color:var(--muted);letter-spacing:.03em}
    @media (min-width:1024px){.card-stock{font-size:11px}}

    .qty-row{display:flex;align-items:center;gap:4px;margin-bottom:6px}
    @media (min-width:1024px){.qty-row{margin-bottom:10px}}

    .qty-control{display:flex;align-items:center;background:var(--silver);border-radius:999px;padding:2px}
    @media (min-width:1024px){.qty-control{padding:3px}}

    .qty-btn{width:22px;height:22px;border:0;background:#fff;border-radius:50%;font-size:12px;font-weight:500;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(32,36,42,.08);transition:background .15s,transform .15s}
    .qty-btn:hover:not(:disabled){background:#fff;transform:scale(1.06)}
    .qty-btn:disabled{opacity:.35;cursor:not-allowed}
    @media (min-width:1024px){.qty-btn{width:32px;height:32px;font-size:15px}}

    .qty-value{width:26px;text-align:center;border:0;background:0;font-size:11px;font-weight:600;color:var(--ink);outline:0;-moz-appearance:textfield;appearance:textfield}
    .qty-value::-webkit-outer-spin-button,.qty-value::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    @media (min-width:1024px){.qty-value{width:38px;font-size:15px}}

    .add-btn{width:100%;padding:8px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:background .22s,transform .16s;text-align:center}
    .add-btn:hover:not(:disabled){background:var(--teal)}
    .add-btn:active:not(:disabled){transform:scale(.985)}
    .add-btn:disabled{background:#C7CBC6;cursor:not-allowed}
    @media (min-width:768px){.add-btn{padding:10px;font-size:11px}}
    @media (min-width:1024px){.add-btn{padding:13px;font-size:12px}}

    .empty-state{grid-column:1/-1;text-align:center;padding:56px 16px}
    .empty-icon{font-size:36px;margin-bottom:10px;opacity:.85}
    .empty-text{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;color:var(--muted)}
    .skeleton-card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
    .skeleton{background:linear-gradient(90deg,#E4E2DC 25%,#F1EFE9 50%,#E4E2DC 75%);background-size:200% 100%;animation:shimmer 1.6s infinite;border-radius:10px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .skeleton-img{aspect-ratio:1/1;border-radius:0}
    .skeleton-line{height:9px;border-radius:6px;margin:9px 12px}

    /* ============ CARRITO ============ */
    .cart-modal{display:none;position:fixed;inset:0;background:rgba(24,24,26,.46);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:100;align-items:flex-end;justify-content:center}
    .cart-modal.show{display:flex;animation:fadeUp .2s ease both}
    .cart-panel{background:#fff;width:100%;max-width:440px;max-height:86vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:slideUp .34s cubic-bezier(.22,1,.36,1);box-shadow:0 -16px 48px rgba(20,20,22,.18)}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .cart-header{position:relative;display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
    .cart-header::before{content:'';position:absolute;top:7px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:99px;background:var(--silver)}
    .cart-header h3{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:500;color:var(--ink)}
    .cart-close{width:30px;height:30px;border-radius:50%;border:0;background:#F1EFE9;font-size:18px;line-height:1;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s}
    .cart-close:hover{background:var(--silver)}
    .cart-items{flex:1;overflow-y:auto;padding:4px 20px;overscroll-behavior:contain}
    .cart-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F2F0EA;gap:10px}
    .cart-item:last-child{border-bottom:0}
    .cart-item-thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#EDEDE9;flex-shrink:0}
    .cart-item-info{flex:1;min-width:0}
    .cart-item-name{font-weight:500;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
    .cart-item-price{font-size:11px;color:var(--muted)}
    .cart-item-price .old{text-decoration:line-through;margin-right:4px;color:#B7B4AE}

  function escapeHtml(str) { const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
  function sanitize(str) { return str ? escapeHtml(String(str)).trim() : ''; }
  function formatPrice(n) { return '$' + Number(n).toLocaleString('es-CL'); }

  /* Imagen: reintento automático y respaldo */
  function driveIdFrom(url){
    if (!url) return null;
    const m = String(url).match(/(?:id=|\/d\/)([\w-]{20,})/);
    return m ? m[1] : null;
  }
  function driveAltUrl(url, size = 400){
    const id = driveIdFrom(url);
    return id ? `https://lh3.googleusercontent.com/d/${id}=w${size}` : '';
  }
  function imgFallback(el){
    if (!el) return;
    if ((el.dataset.fb || '0') === '0' && el.dataset.alt){
      el.dataset.fb = '1';
      el.src = el.dataset.alt;
      return;
    }
    el.removeAttribute('onerror');
    el.onerror = null;
    el.dataset.fb = '2';
    el.src = CONFIG.defImg;
  }

    const price = Number(p.price), off = Number(p.oferta);
    if (price > 0 && off > 0 && off < price){
      const pct = Math.round((1 - off / price) * 100);
      if (pct > 0) return '-' + pct + '%';
    }
    return 'Oferta';
  }

  /* ===== Precio efectivo (oferta si existe y es válida, si no precio normal) ===== */
  function hasOffer(p){
    return p && p.oferta !== null && p.oferta !== undefined && p.oferta !== '' &&
           !isNaN(p.oferta) && Number(p.oferta) > 0;
  }
  function effectivePrice(p){
    return hasOffer(p) ? Number(p.oferta) : Number(p.price);
  }
  /* ============================================================================== */

  function fixDriveUrl(url, size = 400) {
    if (!url || url.length < 10) return CONFIG.defImg;
    const m = url.match(/(?:id=|d\/|file\/d\/)([\w-]{25,})/);
    return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w${size}` : CONFIG.defImg;
  }
  function showToast(msg, type = '') {
    const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
    toastContainer.appendChild(t); setTimeout(() => t.remove(), 2400);
  }
  function saveState() {
    try { localStorage.setItem(CONFIG.STORAGE_CART, JSON.stringify(cart));
          localStorage.setItem(CONFIG.STORAGE_FAVS, JSON.stringify(favorites)); } catch(e){}
  }
  function loadState() {
    try { const c = localStorage.getItem(CONFIG.STORAGE_CART); if (c) cart = JSON.parse(c);
          const f = localStorage.getItem(CONFIG.STORAGE_FAVS); if (f) favorites = JSON.parse(f); } catch(e){}
  }
  function debounce(fn, delay) { return function(...args) { clearTimeout(searchDebounce); searchDebounce = setTimeout(() => fn.apply(this, args), delay); }; }

  /* ---------- MÁQUINA DE ESCRIBIR ---------- */
  let typeTimer = null, phraseCycleInterval = null;
  function startPhraseCycle(){ if (phraseCycleInterval) clearTimeout(phraseCycleInterval); setRandomPhrase(true); }
  function setRandomPhrase(cycle = false){
    if (frases.length === 0) return;
    if (typeTimer) { clearTimeout(typeTimer); typeTimer = null; }
    if (phraseCycleInterval) { clearTimeout(phraseCycleInterval); phraseCycleInterval = null; }
    let randomIndex, currentText = tagline.textContent.trim();
    if (frases.length > 1) { do { randomIndex = Math.floor(Math.random() * frases.length); } while (frases[randomIndex] === currentText); }
    else { randomIndex = 0; }
    const phrase = frases[randomIndex];
    tagline.textContent = ''; tagline.classList.add('typing');
    let i = 0;
    function typeChar(){
      if (i < phrase.length) { tagline.textContent = phrase.substring(0, i + 1); i++; typeTimer = setTimeout(typeChar, 70); }
      else { tagline.textContent = phrase; tagline.classList.remove('typing'); if (cycle) { phraseCycleInterval = setTimeout(() => { setRandomPhrase(true); }, 4000); } }
    }
    typeChar();
  }

  function showError(message, errorDetails = null) {
    console.error('Error:', message, errorDetails);
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <p class="empty-text" style="font-size:14px;color:#880D1E;font-weight:600;">Error al cargar</p>
        <p style="font-size:12px;color:#666;margin:8px 0;max-width:300px;margin-left:auto;margin-right:auto;">${message}</p>
        ${errorDetails ? `<p style="font-size:10px;color:#999;margin:4px 0;max-width:300px;margin-left:auto;margin-right:auto;word-break:break-all;">${errorDetails}</p>` : ''}
        <button onclick="Dari.loadData()" style="margin-top:12px;padding:8px 20px;border:1px solid #C5CBC8;border-radius:100px;background:#fff;cursor:pointer;font-size:12px;">Reintentar</button>
      </div>
    `;
    showToast(`❌ ${message}`, 'error');
  }

  /* ---------- LIGHTBOX ---------- */
  let currentScale = 1, translateX = 0, translateY = 0, isDragging = false;
  let startX, startY, startTranslateX, startTranslateY;
  function openLightbox(src, alt) {
    if (!src || src === CONFIG.defImg) return;
    const highRes = src.replace(/&sz=w\d+/, '&sz=w1200');
    lightboxImg.src = highRes; lightboxImg.alt = alt || 'Joya';
    resetZoom(); lightbox.classList.add('show'); document.body.style.overflow = 'hidden';
  }
  function closeLightbox() { lightbox.classList.remove('show'); document.body.style.overflow = ''; resetZoom(); }
  function resetZoom() {
    currentScale = 1; translateX = 0; translateY = 0;
    lightboxImg.style.transform = 'scale(1) translate(0px,0px)';
    lightboxImg.classList.remove('zoomed'); lightbox.style.cursor = 'zoom-out';
  }
  lightbox.addEventListener('click', e => { if (e.target === lightbox || e.target === lightboxInner || e.target === lightboxImg) closeLightbox(); });
  lightboxClose.addEventListener('click', e => { e.stopPropagation(); closeLightbox(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeLightbox(); closeCartModal(); closeShare(); } });
  lightboxImg.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.08 : 0.08;
    let newScale = Math.min(3, Math.max(0.5, currentScale + delta));
    if (newScale !== currentScale) {
      currentScale = newScale;
      lightboxImg.style.transform = `scale(${currentScale}) translate(${translateX}px, ${translateY}px)`;
      lightboxImg.classList.toggle('zoomed', currentScale > 1);
      lightbox.style.cursor = currentScale > 1 ? 'zoom-in' : 'zoom-out';
    }
  }, { passive: false });
  lightboxImg.addEventListener('dblclick', e => {
    e.preventDefault();
    if (currentScale > 1) resetZoom();
    else { currentScale = 1.5; lightboxImg.style.transform = 'scale(1.5) translate(0,0)'; lightboxImg.classList.add('zoomed'); lightbox.style.cursor = 'zoom-in'; }
  });
  lightboxImg.addEventListener('mousedown', e => {
    if (currentScale <= 1) return;
    isDragging = true; startX = e.clientX; startY = e.clientY;
    startTranslateX = translateX; startTranslateY = translateY;
    lightboxImg.style.cursor = 'grabbing'; e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!isDragging) return;
    translateX = startTranslateX + (e.clientX - startX);
    translateY = startTranslateY + (e.clientY - startY);
    lightboxImg.style.transform = `scale(${currentScale}) translate(${translateX}px, ${translateY}px)`;
  });
  document.addEventListener('mouseup', () => { isDragging = false; lightboxImg.style.cursor = currentScale > 1 ? 'zoom-in' : 'zoom-out'; });

  /* ---------- BÚSQUEDA ---------- */
  function openSearch() { searchExpand.classList.add('open'); searchInput.focus(); }
  function closeSearch() { searchExpand.classList.remove('open'); searchInput.value = ''; searchQuery = ''; renderProducts(); renderCarousel(); }
  searchToggle.addEventListener('click', e => { e.stopPropagation(); if (searchExpand.classList.contains('open')) closeSearch(); else openSearch(); });
  searchClose.addEventListener('click', e => { e.stopPropagation(); closeSearch(); });
  document.addEventListener('click', e => { const inside = searchExpand.contains(e.target) || searchToggle.contains(e.target); if (!inside && searchExpand.classList.contains('open')) closeSearch(); });
  const handleSearch = debounce(function() { searchQuery = searchInput.value.toLowerCase().trim(); renderProducts(); renderCarousel(); }, 200);
  searchInput.addEventListener('input', handleSearch);
  searchInput.addEventListener('keydown', e => { if (e.key === 'Escape') closeSearch(); });

  /* ---------- FAVORITOS ---------- */
  function isFavorite(id) { return favorites.includes(id); }
  function toggleFavorite(pid) {
    const i = favorites.indexOf(pid);
    if (i >= 0) { favorites.splice(i,1); showToast('Eliminado de favoritos'); } else { favorites.push(pid); showToast('Añadido a favoritos','success'); }
    saveState();
    const btn = document.getElementById('fav-'+pid);
    if (btn) btn.innerHTML = isFavorite(pid) ? '❤️' : '🤍';
  }

  /* ---------- CATEGORÍAS ---------- */
  function renderCategories() {
    const types = ["TODOS", ...new Set(inventory.map(p => p.type).filter(Boolean))];
    const list = inventory.some(hasOffer) ? ["TODOS", "OFERTAS", ...types.slice(1)] : types;
    catContainer.innerHTML = list.map(t =>
      `<button class="cat-btn ${t === 'OFERTAS' ? 'offers' : ''} ${currentCategory === t ? 'active' : ''}" onclick="Dari.setCategory('${encodeURIComponent(t)}')">${sanitize(t)}</button>`
    ).join('');
    const active = catContainer.querySelector('.cat-btn.active');
    if (active) catContainer.scrollTo({ left: active.offsetLeft - catContainer.clientWidth / 2 + active.offsetWidth / 2, behavior: 'smooth' });
  }
  function setCategory(cat) { currentCategory = decodeURIComponent(cat); renderCategories(); renderProducts(); renderCarousel(); }

  /* ---------- CANTIDAD ---------- */
  function changeQty(pid, delta) {
    const input = document.getElementById('qty-'+pid);
    const p = inventory.find(x => x.id === pid);
    if (!input || !p) return;
    let v = parseInt(input.value) || 1;
    v = Math.max(1, Math.min(v + delta, p.stock));
    input.value = v; updateAddBtn(pid, v, p.stock);
  }
  function handleQtyInput(pid) {
    const input = document.getElementById('qty-'+pid);
    const p = inventory.find(x => x.id === pid);
    if (!input || !p) return;
    let v = parseInt(input.value);
    if (isNaN(v) || v < 1) v = 1;
    if (v > p.stock) v = p.stock;
    input.value = v; updateAddBtn(pid, v, p.stock);
  }
  function updateAddBtn(pid, qty, stock) {
    const btn = document.getElementById('add-btn-'+pid);
    if (btn) btn.disabled = qty > stock || stock <= 0;
  }

  /* ==========================================================
     CARRUSEL DE OFERTAS (abanico fluido)
     - Arrastre real con el dedo / mouse
     - Transiciones CSS: se pueden interrumpir y encadenar
     - Sin bloqueos: los clics rápidos nunca se pierden
     ========================================================== */
  let carouselProducts = [];
  let fanEls = [];
  let fanIndex = 0;
  let fanVisibleCount = 5;
  let fanDrag = null;
  let fanMoved = false;
  let fanSwipeBlock = false;
  let fanSwipeTimer = null;
  let fanResizeTimer = null;
  let fanLastWidth = window.innerWidth;
  const FAN_DRAG_THRESHOLD = 38;

  function fanMetrics(){
    const w = window.innerWidth;
    if (w < 480)  return { cw:132, visible:5, angle:13, spread:.54, drop:.46 };
    if (w < 900)  return { cw:152, visible:5, angle:14, spread:.57, drop:.50 };
    if (w < 1280) return { cw:178, visible:7, angle:15, spread:.66, drop:.56 };
    return         { cw:198, visible:7, angle:16, spread:.70, drop:.58 };
  }

  function fanHalf(){ return Math.floor(fanMetrics().visible / 2); }

  /* Posición relativa al centro (circular cuando hay más piezas que huecos) */
  function fanOffset(i){
    const total = carouselProducts.length;
    const m = fanMetrics();
    if (total <= m.visible) return i - (total - 1) / 2;
    let d = (i - fanIndex) % total;
    if (d < 0) d += total;
    if (d > total / 2) d -= total;
    return d;
  }

  function layoutFan(){
    const total = carouselProducts.length;
    if (!total) return;
    const m = fanMetrics();
    const half = Math.max(fanHalf(), 1);

    fanEls.forEach(el => {
      const d = fanOffset(+el.dataset.index);
      const ad = Math.abs(d);
      const hidden = ad > half + 0.001;
      const norm = Math.min(ad / half, 1);
      const x = d * m.cw * m.spread;
      const y = norm * norm * m.cw * m.drop;
      const rot = (d / half) * m.angle;
      const scale = Math.max(.6, 1 - .08 * ad);

      el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) rotate(' + rot.toFixed(2) + 'deg) scale(' + scale.toFixed(3) + ')';
      el.style.opacity = hidden ? '0' : '1';
      el.style.zIndex = hidden ? '0' : String(40 - Math.round(ad * 6));
      el.style.pointerEvents = hidden ? 'none' : 'auto';
    });
  }

  function applyFanSize(){
    const m = fanMetrics();
    document.documentElement.style.setProperty('--fan-cw', m.cw + 'px');
    const el = fanEls[fanIndex] || fanEls[0];
    const cardH = el ? el.offsetHeight : Math.round(m.cw * 1.85);
    fanStage.style.height = Math.ceil(cardH + m.cw * m.drop + 48) + 'px';
  }

  function fanCardHtml(p, i){
    const imgSrc = fixDriveUrl(p.img, 500);
    const altSrc = driveAltUrl(imgSrc, 500);
    const isOffer = hasOffer(p);
    const out = p.stock <= 0;
    const low = p.stock > 0 && p.stock <= 5;

    const priceHtml = isOffer
      ? `<span class="fan-card-price-old">${formatPrice(p.price)}</span><span class="fan-card-price-offer">${formatPrice(p.oferta)}</span>`
      : `<span class="fan-card-price">${formatPrice(p.price)}</span>`;

    return `
      <article class="fan-card ${isOffer ? 'offer' : ''}" data-index="${i}">
        <div class="fan-card-img">
          <img src="${imgSrc}" ${altSrc ? `data-alt="${altSrc}"` : ''} alt="${sanitize(p.name)}" loading="lazy" decoding="async"
               onerror="Dari.imgFallback(this)">
          ${isOffer ? `<span class="fan-card-badge">${discountLabel(p)}</span>` : ''}
          ${out ? '<span class="fan-card-stock">Vendido</span>'
                : low ? `<span class="fan-card-stock low">Solo ${p.stock}</span>` : ''}
        </div>
        <div class="fan-card-body">
          <span class="fan-card-type">${sanitize(p.type)}</span>
          <h3 class="fan-card-name">${sanitize(p.name)}</h3>
          <div class="fan-card-prices">${priceHtml}</div>
          <button type="button" class="fan-card-add" data-add-index="${i}" ${out ? 'disabled' : ''}>
            ${out ? 'Vendido' : 'Añadir'}
          </button>
        </div>
      </article>`;
  }

  function buildFan(items){
    carouselProducts = items;
    const total = items.length;
    const m = fanMetrics();
    fanVisibleCount = m.visible;
    fanIndex = 0;

    fanTrack.innerHTML = items.map((p, i) => fanCardHtml(p, i)).join('');
    fanEls = Array.from(fanTrack.querySelectorAll('.fan-card'));

    applyFanSize();
    buildFanDots();
    fanControls.style.display = total > 1 ? 'flex' : 'none';

    /* Posicionamiento inmediato, sin animación de entrada (nunca queda en blanco) */
    fanEls.forEach(el => { el.style.transition = 'none'; });
    layoutFan();
    void fanTrack.offsetWidth;
    fanEls.forEach(el => { el.style.transition = ''; });
  }

  function buildFanDots(){
    const total = carouselProducts.length;
    if (total <= 1){ fanDots.innerHTML = ''; return; }
    if (total <= 16){
      fanDots.innerHTML = carouselProducts.map((_, i) =>
        `<button type="button" class="fan-dot ${i === fanIndex ? 'active' : ''}" data-index="${i}" aria-label="Ver oferta ${i + 1}"></button>`
      ).join('');
      fanDots.querySelectorAll('.fan-dot').forEach(d => {
        d.addEventListener('click', () => fanGoTo(+d.dataset.index));
      });
      updateFanDots(false);
    } else {
      fanDots.innerHTML = `<span class="fan-counter">${fanIndex + 1} / ${total}</span>`;
    }
  }

  function updateFanDots(smooth){
    const total = carouselProducts.length;
    if (total <= 1) return;
    if (total <= 16){
      fanDots.querySelectorAll('.fan-dot').forEach((d, i) => d.classList.toggle('active', i === fanIndex));
      const act = fanDots.querySelector('.fan-dot.active');
      if (act && smooth !== false){
        fanDots.scrollTo({ left: act.offsetLeft - fanDots.clientWidth / 2 + act.offsetWidth / 2, behavior: 'smooth' });
      }
    } else {
      const c = fanDots.querySelector('.fan-counter');
      if (c) c.textContent = `${fanIndex + 1} / ${total}`;
    }
  }

  function fanStep(dir){
    const total = carouselProducts.length;
    if (total <= 1) return;
    fanIndex = ((fanIndex + dir) % total + total) % total;
    updateFanDots();
    layoutFan();
  }

  function fanGoTo(i){
    const total = carouselProducts.length;
    if (total <= 1) return;
    fanIndex = ((i % total) + total) % total;
    updateFanDots();
    layoutFan();
  }

  /* ---- Arrastre ---- */
  function fanDragStart(e){
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest('button')) return;
    fanDrag = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, axis: null };
    fanMoved = false;
    fanStage.classList.add('dragging');
    try { fanStage.setPointerCapture(e.pointerId); } catch (err) {}
  }

  function fanDragMove(e){
    if (!fanDrag || e.pointerId !== fanDrag.id) return;
    const dx = e.clientX - fanDrag.x;
    const dy = e.clientY - fanDrag.y;

    if (fanDrag.axis === null){
      if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
      if (Math.abs(dy) > Math.abs(dx)){
        fanDrag = null;
        fanStage.classList.remove('dragging');
        fanTrack.style.transform = '';
        return;
      }
      fanDrag.axis = 'x';
    }

    const limit = Math.max(130, fanStage.clientWidth * .38);
    const eased = dx / (1 + Math.abs(dx) / (limit * 3));
    fanDrag.dx = eased;
    fanTrack.style.transform = 'translate3d(' + eased.toFixed(1) + 'px,0,0)';
    if (Math.abs(dx) > 8) fanMoved = true;
  }

  function fanDragEnd(e){
    if (!fanDrag) return;
    if (e && e.pointerId !== undefined && e.pointerId !== fanDrag.id) return;
    const dx = fanDrag.dx || 0;
    fanDrag = null;

    fanStage.classList.remove('dragging');
    void fanTrack.offsetWidth;
    fanTrack.style.transform = '';

    if (Math.abs(dx) > FAN_DRAG_THRESHOLD){
      const steps = Math.min(3, Math.max(1, Math.round(Math.abs(dx) / 110)));
      fanStep(dx < 0 ? steps : -steps);
    }
    if (fanMoved){
      fanSwipeBlock = true;
      clearTimeout(fanSwipeTimer);
      fanSwipeTimer = setTimeout(() => { fanSwipeBlock = false; }, 320);
    }
  }

  fanStage.addEventListener('pointerdown', fanDragStart);
  fanStage.addEventListener('pointermove', fanDragMove);
  fanStage.addEventListener('pointerup', fanDragEnd);
  fanStage.addEventListener('pointercancel', () => {
    fanDrag = null;
    fanStage.classList.remove('dragging');
    fanTrack.style.transform = '';
  });
  fanStage.addEventListener('dragstart', e => e.preventDefault());
  fanStage.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight'){ e.preventDefault(); fanStep(1); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); fanStep(-1); }
  });

  fanTrack.addEventListener('click', e => {
    if (fanSwipeBlock) return;

    const addBtn = e.target.closest('.fan-card-add');
    if (addBtn){
      e.stopPropagation();
      const idx = parseInt(addBtn.dataset.addIndex, 10);
      if (!isNaN(idx)) addOneFromCarouselByIndex(idx);
      return;
    }

    const card = e.target.closest('.fan-card');
    if (!card) return;
    const idx = parseInt(card.dataset.index, 10);
    if (isNaN(idx)) return;
    const p = carouselProducts[idx];
    if (!p) return;

    if (carouselProducts.length > fanVisibleCount && idx !== fanIndex){ fanGoTo(idx); return; }
    openLightbox(fixDriveUrl(p.img, 1200), p.name);
  });

  fanPrev.addEventListener('click', () => fanStep(-1));
  fanNext.addEventListener('click', () => fanStep(1));

  window.addEventListener('resize', () => {
    clearTimeout(fanResizeTimer);
    fanResizeTimer = setTimeout(() => {
      if (!carouselProducts.length) return;
      if (Math.abs(window.innerWidth - fanLastWidth) < 10) return;
      fanLastWidth = window.innerWidth;
      const m = fanMetrics();
      if (m.visible !== fanVisibleCount){
        fanVisibleCount = m.visible;
        buildFanDots();
      }
      applyFanSize();
      layoutFan();
    }, 180);
  });

  function renderCarousel(){
    const show = (currentCategory === 'TODOS' && searchQuery === '');
    const offerItems = inventory.filter(p => hasOffer(p) && p.stock > 0);

    if (!show || !offerItems.length){
      carouselWrapper.classList.remove('show');
      carouselProducts = [];
      fanEls = [];
      fanTrack.innerHTML = '';
      return;
    }

    carouselWrapper.classList.add('show');
    carouselTitle.textContent = tituloOferta || 'Ofertas';
    carouselSub.textContent = offerItems.length + (offerItems.length === 1 ? ' pieza con descuento' : ' piezas con descuento');
    buildFan(offerItems);
  }

  /* ---------- RENDER PRODUCTOS ---------- */
  function updateGridHead(count){
    if (gridTitle) {
      gridTitle.textContent = searchQuery ? 'Resultados'
        : currentCategory === 'TODOS' ? 'Catálogo'
        : currentCategory === 'OFERTAS' ? 'Ofertas'
        : currentCategory;
    }
    if (gridCount) gridCount.textContent = count === 1 ? '1 pieza' : count + ' piezas';
  }

  function renderProducts() {
    let list = inventory;
    if (currentCategory === 'OFERTAS') list = inventory.filter(hasOffer);
    else if (currentCategory !== 'TODOS') list = inventory.filter(p => p.type === currentCategory);
    if (searchQuery) {
      list = list.filter(p => (p.name && p.name.toLowerCase().includes(searchQuery)) ||
                              (p.type && p.type.toLowerCase().includes(searchQuery)) ||
                              (p.id && p.id.toLowerCase().includes(searchQuery)));
    }
    updateGridHead(list.length);
    if (!list.length) {
      grid.innerHTML = `<div class="empty-state"><div class="empty-icon">${searchQuery?'🔍':'💎'}</div><p class="empty-text">${searchQuery?'No se encontraron resultados':'No hay productos en esta categoría'}</p></div>`;
      return;
    }
    let html = '';
    list.forEach((p) => { html += createProductCardHtml(p); });
    grid.innerHTML = html;
    list.forEach(p => {
      const inp = document.getElementById('qty-'+p.id);
      if (inp) updateAddBtn(p.id, parseInt(inp.value)||1, p.stock);
    });
  }

  function createProductCardHtml(p) {
    const out = p.stock <= 0, low = p.stock > 0 && p.stock <= 5;
    const fav = isFavorite(p.id);
    const imgSrc = fixDriveUrl(p.img, 400);
    const altSrc = driveAltUrl(imgSrc, 400);
    const nameEnc = encodeURIComponent(p.name);
    const idEnc = encodeURIComponent(p.id);
    const isOffer = hasOffer(p);
    const offerClass = isOffer ? 'offer' : '';
    const badgeOffer = isOffer ? `<div class="offer-badge">${discountLabel(p)}</div>` : '';

    let priceHtml = isOffer
      ? `<span class="original-price">${formatPrice(p.price)}</span><span class="offer-price">${formatPrice(p.oferta)}</span>`
      : `<span class="card-price">${formatPrice(p.price)}</span>`;

    const bodyHtml = `
      <div class="card-body">
        <p class="card-type">${sanitize(p.type)}</p>
        <h3 class="card-title">${sanitize(p.name)}</h3>
        ${p.detail ? `<p class="card-detail">${sanitize(p.detail)}</p>` : ''}
        <div class="card-price-row">
          ${priceHtml}
          ${!out && p.stock > 5 ? `<span class="card-stock">Stock: ${p.stock}</span>` : ''}
        </div>
        <div class="qty-row">
          <div class="qty-control">
            <button class="qty-btn" onclick="Dari.changeQty('${idEnc}',-1)" ${out?'disabled':''}>–</button>
            <input type="number" id="qty-${p.id}" class="qty-value" value="1" min="1" max="${p.stock}"
                   oninput="Dari.handleQtyInput('${idEnc}')" ${out?'disabled':''}>
            <button class="qty-btn" onclick="Dari.changeQty('${idEnc}',1)" ${out?'disabled':''}>+</button>
          </div>
        </div>
        <button id="add-btn-${p.id}" class="add-btn" onclick="Dari.addToCart('${idEnc}')" ${out?'disabled':''}>${out?'Vendido':'Añadir'}</button>
      </div>
    `;

    const extraHtml = `
      <button id="fav-${p.id}" class="fav-btn" onclick="event.stopPropagation();Dari.toggleFavorite('${idEnc}')">${fav?'❤️':'🤍'}</button>
      ${!out ? `<button class="share-btn" onclick="event.stopPropagation();Dari.openShare('${idEnc}')" aria-label="Compartir ${sanitize(p.name)}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.7 6.8-4.4"/><path d="m8.6 13.3 6.8 4.4"/></svg>
      </button>` : ''}
      ${out ? '<span class="stock-badge">Vendido</span>' : low ? `<span class="stock-badge low">Solo ${p.stock}</span>` : ''}
    `;

    const cardClass = `card ${offerClass} card-enter`;
    const delay = Math.min(parseInt(p.id?.slice(-3) || '0'), 15) * 0.04;

    return `
      <article class="${cardClass}" style="animation-delay:${delay}s">
        <div class="card-image">
          <img src="${imgSrc}" ${altSrc ? `data-alt="${altSrc}"` : ''} alt="${sanitize(p.name)}" loading="lazy" decoding="async"
               onclick="Dari.openLightbox('${imgSrc}','${nameEnc}')"
               onerror="Dari.imgFallback(this)">
          ${badgeOffer}
          ${extraHtml}
        </div>
        ${bodyHtml}
      </article>
    `;
  }

  /* ---------- CARRITO ---------- */

  /* Añade un producto al carrito con el PRECIO EFECTIVO (oferta si aplica) */
  function pushCartItem(p, qty){
    const price = effectivePrice(p);
    const exist = cart.find(i => i.id === p.id);
    if (exist) {
      if (exist.q + qty > p.stock) { showToast('Máximo '+p.stock,'error'); return false; }
      exist.q += qty;
      exist.price = price;
      exist.name = p.name;
    } else {
      cart.push({ id: p.id, name: p.name, price: price, q: qty });
    }
    updateCartBar(); saveState(); showToast('Añadido al carrito','success');
    cartBadge.classList.remove('bounce'); void cartBadge.offsetWidth; cartBadge.classList.add('bounce');
    return true;
  }

  function addToCart(pid) {
    const p = inventory.find(x => x.id === pid);
    if (!p || p.stock <= 0) return;
    const qty = parseInt(document.getElementById('qty-'+pid).value) || 1;
    if (qty > p.stock) { showToast('Solo hay '+p.stock+' unidades','error'); return; }
    pushCartItem(p, qty);
  }

  function addOneFromCarouselByIndex(idx) {
    const p = carouselProducts[idx];
    if (!p) { showToast('Producto no encontrado','error'); return; }
    if (p.stock <= 0) { showToast('Sin stock','error'); return; }
    pushCartItem(p, 1);
  }

  function addOneFromCarousel(pid) {
    const p = inventory.find(x => x.id === pid);
    if (!p) { showToast('Producto no encontrado','error'); return; }
    if (p.stock <= 0) { showToast('Sin stock','error'); return; }
    pushCartItem(p, 1);
  }

  function updateCartBar() {
    const total = cart.reduce((s,i) => s + i.q, 0);
    cartBadge.textContent = total > 9 ? '9+' : String(total);
    cartBadge.classList.toggle('show', total > 0);
    renderCartModal();
  }

  function renderCartModal() {
    if (!cart.length) {
      cartModalItems.innerHTML = `<div class="empty-state" style="padding:36px 0"><div class="empty-icon">🛒</div><p class="empty-text">Tu pedido está vacío</p></div>`;
      modalTotal.textContent = '$0'; return;
    }
    let total = 0, html = '';
    cart.forEach((item, idx) => {
      total += item.price * item.q;
      const p = inventory.find(x => x.id === item.id);
      // Mostrar precio normal tachado si el artículo se agregó con precio de oferta
      let priceLine = `${formatPrice(item.price)} c/u`;
      if (p && hasOffer(p) && Number(p.oferta) === Number(item.price) && Number(p.price) > Number(p.oferta)) {
        priceLine = `<span class="old">${formatPrice(p.price)}</span><span class="off">${formatPrice(item.price)} c/u</span>`;
      }
      html += `
      <div class="cart-item">
        ${p ? `<img class="cart-item-thumb" src="${fixDriveUrl(p.img, 120)}" alt="" loading="lazy" onerror="Dari.imgFallback(this)">` : ''}
        <div class="cart-item-info">
          <div class="cart-item-name">${sanitize(item.name)}</div>
          <div class="cart-item-price">${priceLine}</div>
        </div>
        <div class="cart-item-actions">
          <div class="cart-qty">
            <button class="cart-qty-btn" onclick="Dari.updateCartItemQty(${idx},-1)">−</button>
            <input type="number" class="cart-qty-input" value="${item.q}" min="1" oninput="Dari.updateCartItemQty(${idx},0,true)" id="cart-qty-${idx}">
            <button class="cart-qty-btn" onclick="Dari.updateCartItemQty(${idx},1)">+</button>
          </div>
          <button class="cart-delete" onclick="Dari.removeCartItem(${idx})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>
        </div>
      </div>`;
    });
    cartModalItems.innerHTML = html;
    modalTotal.textContent = formatPrice(total);
  }

  function updateCartItemQty(idx, delta, fromInput) {
    const item = cart[idx];
    if (!item) return;
    const p = inventory.find(x => x.id === item.id);
    if (!p) return;
    let q = fromInput ? parseInt(document.getElementById('cart-qty-'+idx).value) : item.q + delta;
    if (isNaN(q) || q < 1) q = 1;
    if (p.stock && q > p.stock) { showToast('Máximo '+p.stock,'error'); q = p.stock; }
    item.q = q;
    // Mantener el precio actualizado según oferta vigente
    item.price = effectivePrice(p);
    updateCartBar(); saveState();
  }

  function removeCartItem(idx) {
    const name = cart[idx]?.name || 'Producto';
    cart.splice(idx, 1);
    updateCartBar(); saveState(); showToast(name + ' eliminado');
    if (!cart.length) closeCartModal();
  }

  function openCartModal() { cartModal.classList.add('show'); renderCartModal(); document.body.style.overflow = 'hidden'; }
  function closeCartModal() { cartModal.classList.remove('show'); document.body.style.overflow = ''; }

  function sendCartOrder() {

    const msg = `Hola Joyas Dari. Me interesa coordinar la compra de:\n\n${items}\n\n¿Me confirman disponibilidad y valor? ¡Gracias!`;

  function renderSkeletons() {
    grid.innerHTML = Array(8).fill('').map(() => `
      <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line" style="width:40%"></div><div class="skeleton skeleton-line" style="width:80%"></div><div class="skeleton skeleton-line" style="width:50%;height:14px;margin-top:12px"></div></div>
    `).join('');

  /* ==============================================================
     COMPARTIR: FLYER CON LA FOTO DE LA JOYA (HISTORIAS / FEED)
     ============================================================== */
  const SHARE_FORMATS = {
    story: { w: 1080, h: 1920, margin: 88, bottom: 112, nameMax: 86, nameMin: 52, nameLines: 3, detailSize: 30, detailLines: 3, priceSize: 96, oldSize: 36 },
    feed:  { w: 1080, h: 1350, margin: 76, bottom: 94,  nameMax: 76, nameMin: 48, nameLines: 2, detailSize: 27, detailLines: 2, priceSize: 84, oldSize: 32 }
  };
  const SERIF = '"Cormorant Garamond", Georgia, serif';
  const SANS = 'Inter, "Segoe UI", Arial, sans-serif';

  let shareProduct = null, shareFormat = 'story', shareBlob = null, shareToken = 0;
  let shareImage = null, shareImageId = null;

  function shareFileName(p) {
    const base = String(p && p.name || 'joya').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'joya';
    return 'joyas-dari-' + base + '.png';
  }

  function loadShareImage(id) {
    if (!id) return Promise.resolve(null);
    return new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = 'https://lh3.googleusercontent.com/d/' + id + '=w1600';
    });
  }

  async function ensureShareImage(p) {
    const id = driveIdFrom(p.img || '');
    const defId = driveIdFrom(CONFIG.defImg);
    const key = id || defId;
    if (shareImage && shareImageId === key) return shareImage;
    let img = id ? await loadShareImage(id) : null;
    if (!img && defId && defId !== id) img = await loadShareImage(defId);
    shareImage = img;
    shareImageId = key;
    return img;
  }

  function trackText(ctx, text, x, y, spacing) {
    const chars = Array.from(String(text));
    let cx = x;
    const prev = ctx.textAlign;
    ctx.textAlign = 'left';
    for (let i = 0; i < chars.length; i++) {
      ctx.fillText(chars[i], cx, y);
      cx += ctx.measureText(chars[i]).width + spacing;
    }
    ctx.textAlign = prev;
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    r = Math.min(r, h / 2, w / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function wrapText(ctx, text, maxW) {
    const words = String(text || '').replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
    const lines = [];
    let cur = '';
    for (const w of words) {
      const next = cur ? cur + ' ' + w : w;
      if (!cur || ctx.measureText(next).width <= maxW) cur = next;
      else { lines.push(cur); cur = w; }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  function clampLines(ctx, lines, maxLines, maxW) {
    if (lines.length <= maxLines) return lines.slice();
    const kept = lines.slice(0, maxLines);
    let last = kept[maxLines - 1];
    let cand = last + '…';
    while (ctx.measureText(cand).width > maxW && last.includes(' ')) {
      last = last.replace(/\s+\S*$/, '');
      cand = last + '…';
    }
    kept[maxLines - 1] = cand;
    return kept;
  }

  function drawFlyer(p, fmt, img) {
    const F = SHARE_FORMATS[fmt] || SHARE_FORMATS.story;
    const W = F.w, H = F.h, M = F.margin, maxW = W - M * 2;
    shareCanvas.width = W;
    shareCanvas.height = H;
    const ctx = shareCanvas.getContext('2d');
    ctx.clearRect(0, 0, W, H);

    /* --- fondo: foto a sangre completa --- */
    if (img && img.naturalWidth) {
      const ir = img.naturalWidth / img.naturalHeight, cr = W / H;
      let dw, dh;
      if (ir > cr) { dh = H; dw = H * ir; } else { dw = W; dh = W / ir; }
      ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
    } else {
      ctx.fillStyle = '#12181A';
      ctx.fillRect(0, 0, W, H);
      const rg = ctx.createRadialGradient(W * 0.35, H * 0.3, 0, W * 0.35, H * 0.3, H * 0.85);
      rg.addColorStop(0, '#26474A');
      rg.addColorStop(1, '#0E1214');
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, W, H);
    }

    /* --- degradados para legibilidad --- */
    let g = ctx.createLinearGradient(0, H * 0.28, 0, H);
    g.addColorStop(0, 'rgba(10,12,14,0)');
    g.addColorStop(0.52, 'rgba(10,12,14,.72)');
    g.addColorStop(1, 'rgba(10,12,14,.97)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    g = ctx.createLinearGradient(0, 0, 0, H * 0.2);
    g.addColorStop(0, 'rgba(8,10,12,.5)');
    g.addColorStop(1, 'rgba(8,10,12,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H * 0.2);

    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';

    /* --- marca --- */
    ctx.fillStyle = 'rgba(255,255,255,.94)';
    ctx.font = '600 ' + Math.round(W * 0.024) + 'px ' + SANS;
    trackText(ctx, 'JOYAS DARI', M, M + 10, 8);
    ctx.fillStyle = 'rgba(255,255,255,.32)';
    ctx.fillRect(M, M + 26, 46, 2);

    /* --- precios --- */
    const isOffer = hasOffer(p);
    const priceText = formatPrice(isOffer ? p.oferta : p.price);
    const oldText = isOffer ? formatPrice(p.price) : '';
    const badge = isOffer ? discountLabel(p) : '';

    let priceSize = F.priceSize;
    ctx.font = '700 ' + priceSize + 'px ' + SANS;
    const reserve = badge ? 170 : 0;
    while (ctx.measureText(priceText).width > maxW - reserve && priceSize > 46) {
      priceSize -= 2;
      ctx.font = '700 ' + priceSize + 'px ' + SANS;
    }
    const priceBase = H - F.bottom;

    /* --- bloque inferior: de abajo hacia arriba --- */
    const priceTop = isOffer
      ? priceBase - priceSize * 0.95 - F.oldSize * 0.8
      : priceBase - priceSize * 0.75;
    const ruleY = Math.round(priceTop - 40);
    const oldBase = isOffer ? Math.round(priceBase - priceSize * 0.95) : 0;

    const detailSize = F.detailSize;
    const detailLh = Math.round(detailSize * 1.5);
    ctx.font = '400 ' + detailSize + 'px ' + SANS;
    const detailLines = p.detail ? clampLines(ctx, wrapText(ctx, p.detail, maxW), F.detailLines, maxW) : [];
    const detailBases = [];
    let db = ruleY - 34;
    for (let i = detailLines.length - 1; i >= 0; i--) { detailBases[i] = db; db -= detailLh; }
    const detailTop = detailLines.length ? detailBases[0] - detailSize * 0.76 : ruleY - 34;
    const nameBottom = detailLines.length ? detailTop - 36 : ruleY - 46;

    let nameSize = F.nameMax;
    let nameLines = [];
    for (;;) {
      ctx.font = '500 ' + nameSize + 'px ' + SERIF;
      nameLines = wrapText(ctx, p.name || 'Joya', maxW);
      if (nameLines.length <= F.nameLines || nameSize <= F.nameMin) break;
      nameSize -= 3;
    }
    nameLines = clampLines(ctx, nameLines, F.nameLines, maxW);
    const nameLh = Math.round(nameSize * 1.06);
    const nameBases = [];
    let nb = nameBottom;
    for (let i = nameLines.length - 1; i >= 0; i--) { nameBases[i] = nb; nb -= nameLh; }
    const nameTop = nameBases[0] - nameSize * 0.76;

    const typeSize = Math.round(W * 0.026);
    const typeBase = Math.round(nameTop - 34);

    /* --- tipo --- */
    ctx.fillStyle = '#E2CBA6';
    ctx.font = '600 ' + typeSize + 'px ' + SANS;
    trackText(ctx, String(p.type || 'JOYA').toUpperCase(), M, typeBase, Math.round(typeSize * 0.22));

    /* --- nombre --- */
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '500 ' + nameSize + 'px ' + SERIF;
    nameLines.forEach((ln, i) => ctx.fillText(ln, M, nameBases[i]));

    /* --- detalle --- */
    if (detailLines.length) {
      ctx.fillStyle = 'rgba(255,255,255,.74)';
      ctx.font = '400 ' + detailSize + 'px ' + SANS;
      detailLines.forEach((ln, i) => ctx.fillText(ln, M, detailBases[i]));
    }

    /* --- línea --- */
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    ctx.fillRect(M, ruleY, Math.min(120, maxW), 2);

    /* --- precio anterior tachado --- */
    if (isOffer) {
      ctx.font = '400 ' + F.oldSize + 'px ' + SANS;
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      const ow = ctx.measureText(oldText).width;
      ctx.fillText(oldText, M, oldBase);
      ctx.fillRect(M - 2, Math.round(oldBase - F.oldSize * 0.33), Math.round(ow + 4), Math.max(2, Math.round(F.oldSize * 0.07)));
    }

    /* --- precio principal --- */
    ctx.font = '700 ' + priceSize + 'px ' + SANS;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(priceText, M, priceBase);

    /* --- badge de descuento --- */
    if (badge) {
      const pw = ctx.measureText(priceText).width;
      const bFont = Math.round(priceSize * 0.3);
      ctx.font = '700 ' + bFont + 'px ' + SANS;
      const tw = ctx.measureText(badge).width;
      const padX = Math.round(bFont * 0.8);
      const bh = Math.round(bFont * 2.05);
      const bw = tw + padX * 2;
      const bx = M + pw + 26;
      const by = priceBase - bh + Math.round(bFont * 0.42);
      if (bx + bw <= W - M) {
        ctx.fillStyle = '#8E1226';
        roundRectPath(ctx, bx, by, bw, bh, bh / 2);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(badge, bx + padX, by + bh / 2 + bFont * 0.36);
      }
    }
  }

  function setShareBusy(busy) {
    shareLoading.classList.toggle('show', busy);
    const off = busy || !shareBlob;
    if (shareNativeBtn) shareNativeBtn.disabled = off;
    if (shareDownloadBtn) shareDownloadBtn.disabled = off;
  }

  async function loadFlyerFonts() {
    if (!document.fonts || !document.fonts.load) return;
    try {
      await Promise.all([
        document.fonts.load('500 80px "Cormorant Garamond"'),
        document.fonts.load('600 30px "Inter"'),
        document.fonts.load('700 80px "Inter"'),
        document.fonts.load('400 30px "Inter"')
      ]);
      await document.fonts.ready;
    } catch (e) { /* usa las fuentes de respaldo */ }
  }

  async function refreshFlyer() {
    if (!shareProduct) return;
    const token = ++shareToken;
    shareBlob = null;
    setShareBusy(true);
    await loadFlyerFonts();
    const img = await ensureShareImage(shareProduct);
    if (token !== shareToken) return;
    drawFlyer(shareProduct, shareFormat, img);
    const blob = await new Promise(res => {
      try { shareCanvas.toBlob(b => res(b), 'image/png'); }
      catch (e) { res(null); }
    });
    if (token !== shareToken) return;
    shareBlob = blob;
    setShareBusy(false);
    if (!blob) showToast('No se pudo generar la imagen');
  }

  async function openShare(pid) {
    const p = inventory.find(x => x.id === pid);
    if (!p) return;
    shareProduct = p;
    shareFormat = 'story';
    document.querySelectorAll('.share-fmt').forEach(b => b.classList.toggle('active', b.dataset.fmt === 'story'));
    if (shareNativeBtn) shareNativeBtn.style.display = (navigator.canShare && window.File) ? '' : 'none';
    shareModal.classList.add('show');
    document.body.style.overflow = 'hidden';
    setShareBusy(true);
    await refreshFlyer();
  }

  function closeShare() {
    shareModal.classList.remove('show');
    document.body.style.overflow = '';
    shareToken++;
    shareProduct = null;
    shareBlob = null;
  }

  function setShareFormat(fmt) {
    if (!shareProduct || !SHARE_FORMATS[fmt] || fmt === shareFormat) return;
    shareFormat = fmt;
    document.querySelectorAll('.share-fmt').forEach(b => b.classList.toggle('active', b.dataset.fmt === fmt));
    refreshFlyer();
  }

  function downloadFlyer() {
    if (!shareBlob || !shareProduct) return;
    const url = URL.createObjectURL(shareBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = shareFileName(shareProduct);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    showToast('Imagen descargada', 'success');
  }

  async function shareFlyer() {
    if (!shareBlob || !shareProduct) return;
    const file = new File([shareBlob], shareFileName(shareProduct), { type: 'image/png' });
    if (!navigator.canShare || !navigator.canShare({ files: [file] })) { downloadFlyer(); return; }
    try {
      await navigator.share({ files: [file], title: 'Joyas Dari', text: shareProduct.name });
    } catch (e) {
      if (e && e.name !== 'AbortError') showToast('No se pudo abrir el menú de compartir');
    }
  }
  /* ============================================================== */

  async function loadData() {
    if (isLoading) return;
    isLoading = true;
    renderSkeletons();
    loadState();
    startPhraseCycle();
    try {
      const res = await fetch(CONFIG.apiUrl);
      if (!res.ok) throw new Error(`Error HTTP ${res.status}: ${res.statusText}`);
      let data;
      try { data = await res.json(); } catch (parseError) { throw new Error('La respuesta no es un JSON válido. Verifica la URL.'); }
      if (data.error) throw new Error(data.error);
      if (!data.productos) throw new Error('La respuesta no contiene "productos". Estructura: { productos: [...] }');
      if (!data.productos.length) {
        grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><p class="empty-text">No hay productos disponibles</p></div>`;
        return;
      }
      tituloOferta = data.titulo_oferta || "Ofertas";

      const usedIds = new Set();
      inventory = data.productos.map((p, i) => {
        let rawId = p.ID || p.id || p.Código || p.Codigo || p.SKU || null;
        let id = rawId ? String(rawId).trim() : '';
        if (!id) { id = `PROD-${String(i + 1).padStart(3, '0')}`; }
        let uniqueId = id;
        let counter = 1;
        while (usedIds.has(uniqueId)) { uniqueId = `${id}-${counter}`; counter++; }
        usedIds.add(uniqueId);

        const ofertaVal = p.Oferta !== undefined ? p.Oferta : p.oferta;
        let oferta = null;
        if (ofertaVal !== undefined && ofertaVal !== null && ofertaVal !== '' && !isNaN(parseFloat(ofertaVal))) {
          const parsed = parseFloat(ofertaVal);
          if (parsed > 0) oferta = parsed;
        }
        return {
          id: uniqueId,
          type: p.Tipo || p.tipo || 'Otros',
          name: p.Contenido || p.contenido || '',
          stock: parseInt(p.Stock || p.stock || 0),
          price: parseInt(p.Precio || p.precio || 0),
          img: fixDriveUrl(p['Link de la Imagen'] || p.link_de_la_imagen || p.imagen || '', 400),
          detail: p.Detalles || p.detalles || p.Detalle || p.detalle || p.Descripción || p.descripcion || '',
          oferta: oferta
        };
      }).filter(p => p.id && p.name);

      if (!inventory.length) throw new Error('No se pudieron procesar productos válidos. Verifica los datos.');

      // Sincronizar precios del carrito guardado con la oferta vigente
      cart.forEach(item => {
        const p = inventory.find(x => x.id === item.id);
        if (p) {
          item.price = effectivePrice(p);
          item.name = p.name;
        }
      });
      if (cart.length) { saveState(); updateCartBar(); }

      renderCategories();
      renderCarousel();
      renderProducts();
    } catch (e) {
      console.error('Error en loadData:', e);
      showError(e.message || 'Error desconocido al cargar los datos', e.stack || 'Sin detalles adicionales');
    } finally {
      isLoading = false;
    }
  }

  window.Dari = {
    openLightbox, closeLightbox, toggleFavorite, setCategory,
    changeQty, handleQtyInput, addToCart, addOneFromCarousel,
    addOneFromCarouselByIndex, imgFallback,
    updateCartBar, renderCartModal, updateCartItemQty, removeCartItem,
    openCartModal, closeCartModal, sendCartOrder, loadData,
    openShare, closeShare, setShareFormat, downloadFlyer, shareFlyer,
    showToast, showError, CONFIG
  };

  loadState();
  document.addEventListener('DOMContentLoaded', loadData);
})();
</script>
</body>
</html>
