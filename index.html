<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1C1C1E">
  <meta name="description" content="Catálogo de joyas únicas de Joyas Dari. Piezas con materiales de calidad.">
  <title>Joyas Dari · Catálogo</title>
  <link rel="icon" href="https://drive.google.com/thumbnail?id=1avUuzvlAKSWBiaSQ8td4Xgv1fsg4ebuf&sz=w32" type="image/png">
  <link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=1avUuzvlAKSWBiaSQ8td4Xgv1fsg4ebuf&sz=w180">
  <meta property="og:title" content="Joyas Dari · Joyas con estilo">
  <meta property="og:description" content="Catálogo de joyas únicas. Piezas con materiales de calidad.">
  <meta property="og:image" content="https://drive.google.com/thumbnail?id=1avUuzvlAKSWBiaSQ8td4Xgv1fsg4ebuf&sz=w1200">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://drive.google.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Archivo:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --paper:#F6F4EF;--paper-2:#E8EAE6;--paper-3:#D9DAD5;
      --white:#FFFFFF;--ink:#20242A;--ink-soft:#2A2E34;
      --dark:#26262A;--dark-deep:#1C1C1E;--cream:#F7F4EE;
      --muted:#726D63;--teal:#15696F;--teal-light:#63BDB5;--bordeaux:#8E1226;
      --accent:var(--teal);--accent-dark:#0F5156;--offer:var(--bordeaux);
      --line:rgba(32,36,42,.12);--line-soft:rgba(32,36,42,.07);--line-strong:rgba(32,36,42,.34);
      --serif:'Playfair Display',Didot,'Times New Roman',Georgia,serif;
      --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --fan-cw:180px;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    img{display:block;max-width:100%}
    button{font-family:inherit}
    a{color:inherit}
    ::selection{background:var(--ink);color:var(--paper)}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

    /* ============ HEADER ============ */
    .header{position:sticky;top:0;z-index:50;color:var(--cream);background:linear-gradient(180deg,var(--dark-deep) 0%,var(--dark) 100%);border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 12px 30px -18px rgba(20,20,22,.55)}
    .header-top{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 16px 10px;min-height:66px;max-width:1440px;margin:0 auto}
    .brand-group{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0;transition:opacity .2s ease}
    .logo-badge{width:42px;height:42px;border-radius:50%;overflow:hidden;flex-shrink:0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
    .logo-img{height:100%;width:100%;object-fit:cover}
    .brand-block{min-width:0;text-align:center;line-height:1.1}
    .brand-title{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:.005em;color:var(--cream);white-space:nowrap;line-height:1.25;padding-bottom:1px}
    .brand-block::after{content:'Joyería · La Ligua';display:block;margin-top:3px;font-family:var(--sans);font-size:7.5px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:rgba(247,244,238,.62)}
    .header-right{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:2px;flex-shrink:0}
    .header-action-btn{position:relative;width:38px;height:38px;border:0;border-bottom:1px solid transparent;border-radius:0;background:transparent;color:var(--cream);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .22s,color .22s}
    .header-action-btn:hover{border-bottom-color:var(--teal-light)}
    .header-action-btn:active{color:var(--teal-light)}
    .cart-badge{position:absolute;top:-1px;right:-1px;min-width:16px;height:16px;border-radius:50%;background:var(--teal-light);color:#10292A;font-size:9px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px;border:0}
    .cart-badge.show{display:flex}
    .header button:focus-visible,.header a:focus-visible,.header input:focus-visible{outline-color:var(--teal-light)}

    .search-expandable{position:relative;display:flex;align-items:center;overflow:hidden;width:0;opacity:0;transition:width .32s cubic-bezier(.22,1,.36,1),opacity .24s ease}
    .search-expandable.open{width:190px;opacity:1;margin-left:2px}
    .search-expandable input{width:100%;padding:8px 26px 8px 4px;border:0;border-bottom:1px solid rgba(255,255,255,.32);border-radius:0;background:transparent;color:var(--cream);font-size:13px;outline:none;transition:border-color .2s}
    .search-expandable input::placeholder{color:rgba(247,244,238,.6)}
    .search-expandable input:focus{border-bottom-color:var(--teal-light)}
    .search-expandable .search-icon-inner{display:none}
    .search-expandable .search-close-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);background:0;border:0;color:rgba(247,244,238,.55);font-size:17px;line-height:1;cursor:pointer;padding:4px}

    .tagline-container{text-align:center;padding:7px 16px 8px;min-height:30px;display:flex;align-items:center;justify-content:center;border-top:1px solid rgba(255,255,255,.08);margin-top:9px}
    .tagline{font-family:var(--serif);font-style:italic;font-size:13.5px;font-weight:500;color:rgba(247,244,238,.78);letter-spacing:.01em;display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.4em}
    .tagline.typing::after{content:'';display:inline-block;width:1px;height:1em;margin-left:3px;vertical-align:-.12em;background:var(--teal-light);animation:blink .7s step-end infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

    .categories{display:flex;gap:22px;overflow-x:auto;padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .categories::-webkit-scrollbar{display:none}
    .cat-btn{flex-shrink:0;padding:11px 0;border:0;border-bottom:1px solid transparent;border-radius:0;background:none;color:rgba(247,244,238,.64);font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:color .22s,border-color .22s}
    .cat-btn:hover{color:var(--cream)}
    .cat-btn.active{color:var(--cream);border-bottom-color:var(--teal-light);font-weight:600}
    .cat-btn.offers.active{color:var(--teal-light);border-bottom-color:var(--teal-light)}
    .cat-btn:focus-visible{outline-color:var(--teal-light)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    /* ============ CARRUSEL ============ */
    .carousel-wrapper{position:relative;display:none;padding:0 0 4px;background:var(--paper);border-bottom:1px solid var(--ink);overflow:hidden}
    .carousel-wrapper.show{display:block;animation:fadeUp .45s ease both}
    .carousel-head{display:grid;grid-template-columns:1fr auto;align-items:end;gap:0 18px;text-align:left;padding:26px 16px 4px;max-width:1440px;margin:0 auto}
    .carousel-eyebrow{grid-column:1;font-size:9px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
    .carousel-title{grid-column:1;font-family:var(--serif);font-size:clamp(32px,5.4vw,50px);font-weight:500;color:var(--ink);letter-spacing:-.02em;margin-top:6px;line-height:.98}
    .carousel-sub{grid-column:2;grid-row:1 / 3;align-self:end;justify-self:end;font-size:9px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;padding-bottom:5px;text-align:right}

    .fan-stage{position:relative;width:100%;max-width:1440px;height:380px;margin:0 auto;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
    .fan-stage:focus{outline:none}
    .fan-stage:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
    .fan-stage.dragging{cursor:grabbing}
    .fan-layout{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.22,1,.36,1);will-change:transform}
    .fan-stage.dragging .fan-layout{transition:none}

    .fan-card{
      position:absolute;top:0;left:calc(50% - var(--fan-cw) / 2);
      width:var(--fan-cw);
      font-size:clamp(11px, calc(var(--fan-cw) * .083), 17px);
      border-radius:0;overflow:hidden;background:var(--white);
      border:1px solid var(--line-strong);
      box-shadow:6px 6px 0 rgba(22,21,19,.05);
      display:flex;flex-direction:column;
      transform-origin:50% 100%;
      transition:transform .52s cubic-bezier(.22,1,.36,1),opacity .34s ease,box-shadow .3s ease;
      will-change:transform,opacity;
      backface-visibility:hidden;
      cursor:pointer;
    }
    .fan-card.offer{border-color:rgba(142,18,38,.85)}
    .fan-card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

    .fan-card-img{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--paper-2);flex-shrink:0;border-bottom:1px solid var(--line)}
    .fan-card-img img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
    .fan-card-badge{position:absolute;top:.55em;left:.55em;background:var(--offer);color:#fff;font-size:.52em;font-weight:600;padding:.3em .7em;border-radius:0;text-transform:uppercase;letter-spacing:.14em;z-index:2}
    .fan-card-stock{position:absolute;bottom:.55em;left:.55em;background:rgba(32,36,42,.9);color:#fff;border:1px solid transparent;font-size:.54em;font-weight:600;padding:.3em .7em;border-radius:0;text-transform:uppercase;letter-spacing:.12em;z-index:2}
    .fan-card-stock.low{background:var(--offer);border-color:var(--offer)}

    .fan-card-body{padding:.9em .9em .85em;display:flex;flex-direction:column;gap:.28em;background:var(--white);flex:1}
    .fan-card-type{font-size:.56em;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
    .fan-card-name{font-family:var(--serif);font-size:1.14em;font-weight:500;line-height:1.15;color:var(--ink);height:2.3em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .fan-card-prices{display:flex;align-items:baseline;gap:.35em;flex-wrap:nowrap;overflow:hidden;min-height:1.3em;margin-top:.05em;font-variant-numeric:tabular-nums}
    .fan-card-price{font-size:.95em;font-weight:600;color:var(--ink);letter-spacing:.01em}
    .fan-card-price-old{font-size:.66em;color:var(--muted);text-decoration:line-through;font-weight:400}
    .fan-card-price-offer{font-size:.98em;font-weight:600;color:var(--offer)}
    .fan-card-add{display:flex;align-items:center;justify-content:space-between;gap:.45em;width:100%;margin-top:auto;padding:.72em 0 0;border:0;border-top:1px solid var(--line);border-radius:0;background:none;color:var(--ink);font-size:.56em;font-weight:600;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:color .22s,border-color .22s}
    .fan-card-add::after{content:'+';font-size:1.35em;line-height:1;font-weight:400;margin-top:-.1em}
    .fan-card-add:hover:not(:disabled){color:var(--accent);border-top-color:var(--accent)}
    .fan-card-add:active:not(:disabled){color:var(--accent-dark)}
    .fan-card-add:disabled{color:var(--muted);cursor:not-allowed}
    .fan-card-add:disabled::after{content:none}

    .fan-controls{display:flex;justify-content:center;align-items:center;gap:14px;padding:18px 0 22px}
    .fan-btn{width:40px;height:40px;border-radius:0;background:transparent;color:var(--ink);border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;transition:background .22s,color .22s}
    .fan-btn:hover{background:var(--ink);color:var(--paper)}
    .fan-btn:active{background:var(--accent);border-color:var(--accent);color:#fff}
    .fan-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .fan-dots{display:flex;gap:2px;align-items:center;max-width:52vw;overflow-x:auto;scrollbar-width:none;padding:2px}
    .fan-dots::-webkit-scrollbar{display:none}
    .fan-dot{position:relative;width:18px;height:16px;border:0;border-radius:0;background:transparent;padding:0;cursor:pointer;flex-shrink:0;transition:width .28s cubic-bezier(.22,1,.36,1)}
    .fan-dot::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line-strong);transition:background .24s}
    .fan-dot.active{width:34px}
    .fan-dot.active::after{background:var(--accent);height:2px}
    .fan-counter{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.2em;white-space:nowrap}

    /* ============ SECCIÓN / GRID ============ */
    .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:36px 16px 14px;max-width:1440px;margin:0 auto;border-bottom:1px solid var(--ink)}
    .section-title{font-family:var(--serif);font-size:clamp(28px,4.4vw,42px);font-weight:500;color:var(--ink);line-height:1.02;letter-spacing:-.02em}
    .section-count{font-size:9px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);padding-bottom:3px;white-space:nowrap}

    .product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 12px;padding:22px 12px 56px;margin:0 auto;max-width:1440px}
    @media (min-width:640px){.product-grid{grid-template-columns:repeat(3,1fr);gap:26px 16px;padding:28px 16px 64px}}
    @media (min-width:1024px){.product-grid{gap:34px 22px;padding:36px 24px 84px}}
    @media (min-width:1280px){.product-grid{gap:38px 26px}}

    .card{background:var(--white);border:1px solid var(--line-soft);border-radius:0;box-shadow:none;display:flex;flex-direction:column;position:relative;height:100%}
    .card:hover{border-color:var(--line)}
    .card.offer .card-price-row .original-price{text-decoration:line-through;color:var(--muted);font-size:11px;margin-right:6px;font-weight:400}
    .card.offer .card-price-row .offer-price{color:var(--offer);font-weight:600}
    .offer-badge{position:absolute;top:0;left:0;background:var(--offer);color:#fff;font-size:8px;font-weight:600;padding:5px 9px;border-radius:0;text-transform:uppercase;letter-spacing:.14em;z-index:3}

    .card-image{position:relative;aspect-ratio:1/1;background:var(--paper-2);overflow:hidden;border:0;border-bottom:1px solid var(--line-soft)}
    .card-image img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.22,1,.36,1);cursor:zoom-in}
    @media (hover:hover){.card-image img:hover{transform:scale(1.035)}}
    .fav-btn{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:0;background:rgba(255,255,255,.92);border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:color .18s,background .18s;z-index:2;backdrop-filter:blur(3px)}
    .fav-btn:hover{background:var(--white)}
    .fav-btn.is-fav{color:var(--offer)}
    .fav-btn svg{width:14px;height:14px}
    .share-btn{position:absolute;bottom:8px;right:8px;width:30px;height:30px;border-radius:0;background:rgba(255,255,255,.92);border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:color .18s,background .18s;z-index:2;backdrop-filter:blur(3px)}
    .share-btn:hover{background:var(--white);color:var(--accent)}
    .share-btn svg{width:13px;height:13px}
    .stock-badge{position:absolute;bottom:8px;left:8px;background:var(--offer);color:#fff;border:1px solid transparent;font-size:8px;font-weight:600;padding:4px 7px;border-radius:0;text-transform:uppercase;letter-spacing:.12em;z-index:2}
    .stock-badge.low{background:rgba(32,36,42,.9);border-color:transparent;color:#fff}

    .card-body{padding:13px 11px 12px;display:flex;flex-direction:column;flex:1}
    @media (min-width:768px){.card-body{padding:15px 13px 14px}}
    @media (min-width:1024px){.card-body{padding:17px 15px 16px}}

    .card-type{font-size:8px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
    @media (min-width:1024px){.card-type{font-size:9px;margin-bottom:6px}}

    .card-title{font-family:var(--serif);font-size:16px;font-weight:500;line-height:1.15;color:var(--ink);margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.3em}
    @media (min-width:768px){.card-title{font-size:19px}}
    @media (min-width:1024px){.card-title{font-size:22px;min-height:2.3em}}

    .card-detail{font-size:9.5px;color:var(--muted);font-weight:400;line-height:1.4;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    @media (min-width:1024px){.card-detail{font-size:11.5px;margin-bottom:8px}}

    .card-price-row{display:flex;align-items:baseline;justify-content:flex-start;margin-top:auto;margin-bottom:10px;padding-top:9px;border-top:1px solid var(--line);flex-wrap:wrap;gap:2px 6px;font-variant-numeric:tabular-nums}
    .card-price-row .card-stock{margin-left:auto}
    .card-price{font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:.01em}
    @media (min-width:768px){.card-price{font-size:17px}}
    @media (min-width:1024px){.card-price{font-size:19px}}
    .card-stock{font-size:8.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
    @media (min-width:1024px){.card-stock{font-size:9.5px}}

    .qty-row{display:flex;align-items:center;gap:4px;margin-bottom:7px}
    @media (min-width:1024px){.qty-row{margin-bottom:10px}}

    .qty-control{display:flex;align-items:center;background:transparent;border:1px solid var(--line);border-radius:0;padding:0}
    .qty-btn{width:24px;height:24px;border:0;background:transparent;border-radius:0;font-size:13px;font-weight:400;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
    .qty-btn:hover:not(:disabled){background:var(--paper-2)}
    .qty-btn:disabled{opacity:.3;cursor:not-allowed}
    @media (min-width:1024px){.qty-btn{width:30px;height:30px;font-size:15px}}

    .qty-value{width:28px;text-align:center;border:0;background:0;font-size:11px;font-weight:600;color:var(--ink);outline:0;-moz-appearance:textfield;appearance:textfield;font-variant-numeric:tabular-nums}
    .qty-value::-webkit-outer-spin-button,.qty-value::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    @media (min-width:1024px){.qty-value{width:36px;font-size:13px}}

    .add-btn{width:100%;padding:9px;border:1px solid var(--ink);border-radius:0;background:var(--ink);color:var(--paper);font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background .22s,border-color .22s,color .22s;text-align:center}
    .add-btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#fff}
    .add-btn:active:not(:disabled){background:var(--accent-dark);border-color:var(--accent-dark)}
    .add-btn:disabled{background:transparent;border-color:var(--line);color:var(--muted);cursor:not-allowed}
    @media (min-width:768px){.add-btn{padding:11px;font-size:10px}}
    @media (min-width:1024px){.add-btn{padding:13px;font-size:11px}}

    .empty-state{grid-column:1/-1;text-align:center;padding:64px 16px 76px}
    .empty-icon{font-family:var(--serif);font-size:38px;line-height:1;margin-bottom:12px;color:var(--accent)}
    .empty-text{font-family:var(--serif);font-style:italic;font-weight:500;font-size:20px;color:var(--muted)}
    .skeleton-card{background:transparent;border:0;border-radius:0;overflow:hidden}
    .skeleton{background:linear-gradient(90deg,var(--paper-2) 25%,var(--white) 50%,var(--paper-2) 75%);background-size:200% 100%;animation:shimmer 1.6s infinite;border-radius:0}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .skeleton-img{aspect-ratio:1/1;border-radius:0}
    .skeleton-line{height:9px;border-radius:0;margin:10px 2px}

    /* ============ CARRITO ============ */
    .cart-modal{display:none;position:fixed;inset:0;background:rgba(22,21,19,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:100;align-items:flex-end;justify-content:center}
    .cart-modal.show{display:flex;animation:fadeUp .2s ease both}
    .cart-panel{background:var(--white);width:100%;max-width:460px;max-height:88vh;border:1px solid var(--ink);border-bottom:0;border-radius:0;display:flex;flex-direction:column;animation:slideUp .34s cubic-bezier(.22,1,.36,1);box-shadow:0 -20px 60px rgba(20,20,22,.18)}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .cart-header{position:relative;display:flex;align-items:center;justify-content:space-between;padding:20px 20px 14px;border-bottom:1px solid var(--ink)}
    .cart-header::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:34px;height:2px;border-radius:0;background:var(--line-strong)}
    .cart-header h3{font-family:var(--serif);font-size:26px;font-weight:500;color:var(--ink);line-height:1}
    .cart-close{width:32px;height:32px;border-radius:0;border:1px solid var(--line);background:transparent;font-size:19px;line-height:1;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s,color .18s}
    .cart-close:hover{background:var(--ink);color:var(--paper)}
    .cart-items{flex:1;overflow-y:auto;padding:2px 20px;overscroll-behavior:contain}
    .cart-item{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}
    .cart-item:last-child{border-bottom:0}
    .cart-item-thumb{width:50px;height:50px;border-radius:0;object-fit:cover;background:var(--paper-2);border:1px solid var(--line-soft);flex-shrink:0}
    .cart-item-info{flex:1;min-width:0}
    .cart-item-name{font-weight:500;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
    .cart-item-price{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
    .cart-item-price .old{text-decoration:line-through;margin-right:5px;color:var(--muted)}
    .cart-item-price .off{color:var(--offer);font-weight:600}
    .cart-item-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
    .cart-qty{display:flex;align-items:center;background:transparent;border:1px solid var(--line);border-radius:0;padding:0}
    .cart-qty-btn{width:24px;height:24px;border:0;background:transparent;border-radius:0;font-size:13px;font-weight:400;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
    .cart-qty-btn:hover{background:var(--paper-2)}
    .cart-qty-input{width:26px;text-align:center;border:0;background:0;font-size:12px;font-weight:600;outline:0;color:var(--ink);font-variant-numeric:tabular-nums}
    .cart-delete{width:28px;height:28px;border-radius:0;border:1px solid rgba(142,18,38,.24);background:transparent;color:var(--offer);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s,color .18s,border-color .18s}
    .cart-delete:hover{background:var(--offer);border-color:var(--offer);color:#fff}
    .cart-footer{padding:18px 20px calc(22px + env(safe-area-inset-bottom));border-top:1px solid var(--ink);background:#FBFAF7}
    .cart-total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
    .cart-total-label{font-size:9px;color:var(--muted);letter-spacing:.24em;text-transform:uppercase}
    .cart-total-amount{font-family:var(--serif);font-size:30px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
    .whatsapp-btn{width:100%;padding:15px;border:1px solid var(--teal);border-radius:0;background:var(--teal);color:#fff;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background .22s,border-color .22s}
    .whatsapp-btn:hover{background:#11575B;border-color:#11575B;color:#fff}
    .whatsapp-btn:active{background:#0E4A4E;border-color:#0E4A4E}

    /* ============ COMPARTIR (FLYER) ============ */
    .share-modal{display:none;position:fixed;inset:0;background:rgba(22,21,19,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:110;align-items:center;justify-content:center;padding:14px}
    .share-modal.show{display:flex;animation:fadeUp .2s ease both}
    .share-panel{background:var(--paper);width:100%;max-width:480px;max-height:94vh;border:1px solid var(--ink);border-radius:0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(20,20,22,.32);animation:shareIn .3s cubic-bezier(.22,1,.36,1)}
    @keyframes shareIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .share-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
    .share-head h3{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--ink)}
    .share-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 18px 12px}
    .share-stage canvas{max-width:100%;max-height:54vh;width:auto;height:auto;border-radius:0;box-shadow:0 12px 30px rgba(32,36,42,.22);display:block;background:#12181A}
    .share-loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:9px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
    .share-loading.show{display:flex}
    .share-formats{display:flex;gap:6px;justify-content:center;padding:0 18px 12px}
    .share-fmt{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:0;padding:8px 14px;font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:background .18s,color .18s,border-color .18s}
    .share-fmt:hover{border-color:var(--ink);color:var(--ink)}
    .share-fmt.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}
    .share-actions{display:flex;gap:8px;padding:12px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--ink);background:var(--paper)}
    .share-action{flex:1;padding:14px 10px;border-radius:0;font-size:9.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:background .2s,border-color .2s,color .2s,opacity .2s;display:flex;align-items:center;justify-content:center;gap:7px}
    .share-action svg{width:14px;height:14px;flex-shrink:0}
    .share-action.primary{background:var(--ink);border:1px solid var(--ink);color:var(--paper)}
    .share-action.primary:hover{background:var(--teal);border-color:var(--teal);color:#fff}
    .share-action.secondary{background:transparent;border:1px solid var(--ink);color:var(--ink)}
    .share-action.secondary:hover{background:var(--ink);color:var(--paper)}
    .share-action:active{transform:scale(.99)}
    .share-action[disabled]{opacity:.4;pointer-events:none}

    /* ============ LIGHTBOX / TOAST / FOOTER ============ */
    .lightbox{display:none;position:fixed;inset:0;background:rgba(12,12,11,.97);z-index:200;align-items:center;justify-content:center;cursor:zoom-out;overflow:hidden;user-select:none}
    .lightbox.show{display:flex}
    .lightbox .lightbox-inner{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .lightbox img{max-width:95vw;max-height:90vh;width:auto;height:auto;object-fit:contain;border-radius:0;box-shadow:0 24px 64px rgba(0,0,0,.45);transition:transform .1s;touch-action:none;cursor:zoom-in}
    .lightbox img.zoomed{cursor:zoom-out}
    .lightbox-close{position:absolute;top:16px;right:18px;width:42px;height:42px;border-radius:0;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.28);color:#fff;font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;backdrop-filter:blur(6px);z-index:10}
    .lightbox-close:hover{background:rgba(255,255,255,.14)}
    .lightbox .zoom-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.5);font-size:9px;letter-spacing:.2em;text-transform:uppercase;pointer-events:none;background:rgba(0,0,0,.25);padding:7px 16px;border-radius:0;backdrop-filter:blur(4px)}
    @media (hover:none){.lightbox .zoom-hint{display:none}}
    .toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:300;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center}
    .toast{background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:0;font-size:10.5px;font-weight:500;letter-spacing:.06em;box-shadow:0 12px 32px rgba(20,20,22,.22);animation:toastIn .3s cubic-bezier(.22,1,.36,1);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
    .toast.success{background:var(--teal)}
    .toast.error{background:var(--offer)}
    @keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

    .footer{background:linear-gradient(180deg,var(--dark) 0%,var(--dark-deep) 100%);padding:52px 20px 44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;border-top:1px solid rgba(255,255,255,.08);text-align:center}
    .footer-brand{font-family:var(--serif);font-size:clamp(34px,6.4vw,58px);font-weight:500;letter-spacing:-.005em;color:var(--cream);line-height:1.05;text-align:center}
    .footer-note{font-size:8.5px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:rgba(247,244,238,.55);text-align:center}
    .footer-social{display:flex;justify-content:center;gap:9px;margin-top:2px}
    .social-btn{width:38px;height:38px;border-radius:0;border:1px solid rgba(247,244,238,.24);background:transparent;color:rgba(247,244,238,.82);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .22s,color .22s,border-color .22s;text-decoration:none}
    .social-btn:hover{background:var(--cream);color:var(--dark);border-color:var(--cream)}
    .social-btn--wa:hover{background:#3DD16F;color:#0B2F1C;border-color:#3DD16F}

    .card-enter{animation:cardIn .4s cubic-bezier(.22,1,.36,1) both}
    @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .bounce{animation:bounce .4s cubic-bezier(.34,1.56,.64,1)}
    @keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.18)}}

    }
</style>

<!-- Modal "Compartir": muestra un flyer ya renderizado en <canvas>.
     El canvas es el original de 1080 px (solo se escala por CSS), así que lo
     que se ve es exactamente el PNG que se comparte o descarga.
     "Compartir" usa la Web Share API (en el celular abre Instagram/WhatsApp);
     "Descargar" guarda el PNG. El botón nativo se oculta por JS si el
     navegador no soporta compartir archivos (típico en escritorio). -->
<div id="shareModal" class="share-modal" onclick="if(event.target===this) Dari.closeShare()">
  <div class="share-panel" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <div class="share-head">
      <h3 id="shareTitle">Compartir</h3>
      <button class="cart-close" onclick="Dari.closeShare()" aria-label="Cerrar">&times;</button>
    </div>
    <div class="share-stage" id="shareStage">
      <canvas id="shareCanvas" width="1080" height="1920"></canvas>
      <div class="share-loading" id="shareLoading">Generando</div>
    </div>
    <div class="share-formats">
      <!-- 1080x1920 (9:16) para historias; 1080x1350 (4:5) para el feed -->
      <button class="share-fmt active" data-fmt="story" onclick="Dari.setShareFormat('story')">Historia 9:16</button>
      <button class="share-fmt" data-fmt="feed" onclick="Dari.setShareFormat('feed')">Feed 4:5</button>
    </div>

  /* ---------- UTILIDADES ---------- */
  function escapeHtml(str) { const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
  function sanitize(str) { return str ? escapeHtml(String(str)).trim() : ''; }
  function formatPrice(n) { return '$' + Number(n).toLocaleString('es-CL'); }

  /* Imagen: reintento automático y respaldo */
  function driveIdFrom(url){
    if (!url) return null;
    const m = String(url).match(/(?:id=|\/d\/)([\w-]{20,})/);
    return m ? m[1] : null;
  }
  function driveAltUrl(url, size = 400){
    const id = driveIdFrom(url);
    return id ? `https://lh3.googleusercontent.com/d/${id}=w${size}` : '';
  }
  function imgFallback(el){
    if (!el) return;
    if ((el.dataset.fb || '0') === '0' && el.dataset.alt){
      el.dataset.fb = '1';
      el.src = el.dataset.alt;
      return;
    }
    el.removeAttribute('onerror');
    el.onerror = null;
    el.dataset.fb = '2';
    el.src = CONFIG.defImg;
  }
  function discountLabel(p){
    const price = Number(p.price), off = Number(p.oferta);
    if (price > 0 && off > 0 && off < price){
      const pct = Math.round((1 - off / price) * 100);
      if (pct > 0) return '-' + pct + '%';
    }
    return 'Oferta';
  }

  /* ===== Precio efectivo (oferta si existe y es válida, si no precio normal) ===== */
  function hasOffer(p){
    return p && p.oferta !== null && p.oferta !== undefined && p.oferta !== '' &&
           !isNaN(p.oferta) && Number(p.oferta) > 0;
  }
  function effectivePrice(p){
    return hasOffer(p) ? Number(p.oferta) : Number(p.price);
  }

  function fixDriveUrl(url, size = 400) {
    if (!url || url.length < 10) return CONFIG.defImg;
    const m = url.match(/(?:id=|d\/|file\/d\/)([\w-]{25,})/);
    return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w${size}` : CONFIG.defImg;
  }
  function showToast(msg, type = '') {
    const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
    toastContainer.appendChild(t); setTimeout(() => t.remove(), 2400);
  }
  function saveState() {

          localStorage.setItem(CONFIG.STORAGE_FAVS, JSON.stringify(favorites)); } catch(e){}
  }
  function loadState() {
    try { const c = localStorage.getItem(CONFIG.STORAGE_CART); if (c) cart = JSON.parse(c);
          const f = localStorage.getItem(CONFIG.STORAGE_FAVS); if (f) favorites = JSON.parse(f); } catch(e){}
  }
  function debounce(fn, delay) { return function(...args) { clearTimeout(searchDebounce); searchDebounce = setTimeout(() => fn.apply(this, args), delay); }; }

  /* ---------- MÁQUINA DE ESCRIBIR ---------- */
  let typeTimer = null, phraseCycleInterval = null;
  function startPhraseCycle(){ if (phraseCycleInterval) clearTimeout(phraseCycleInterval); setRandomPhrase(true); }
  function setRandomPhrase(cycle = false){
    if (frases.length === 0) return;
    if (typeTimer) { clearTimeout(typeTimer); typeTimer = null; }
    if (phraseCycleInterval) { clearTimeout(phraseCycleInterval); phraseCycleInterval = null; }
    let randomIndex, currentText = tagline.textContent.trim();
    if (frases.length > 1) { do { randomIndex = Math.floor(Math.random() * frases.length); } while (frases[randomIndex] === currentText); }
    else { randomIndex = 0; }
    const phrase = frases[randomIndex];
    tagline.textContent = ''; tagline.classList.add('typing');
    let i = 0;
    function typeChar(){
      if (i < phrase.length) { tagline.textContent = phrase.substring(0, i + 1); i++; typeTimer = setTimeout(typeChar, 70); }
      else { tagline.textContent = phrase; tagline.classList.remove('typing'); if (cycle) { phraseCycleInterval = setTimeout(() => { setRandomPhrase(true); }, 4000); } }
    }
    typeChar();
  }

  function showError(message, errorDetails = null) {
    console.error('Error:', message, errorDetails);
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">!</div>
        <p class="empty-text" style="font-size:16px;color:var(--offer);font-style:normal;">Error al cargar</p>
        <p style="font-size:11px;letter-spacing:.04em;color:var(--muted);margin:10px auto;max-width:320px;">${message}</p>
        ${errorDetails ? `<p style="font-size:10px;color:var(--muted);margin:4px auto;max-width:320px;word-break:break-all;">${errorDetails}</p>` : ''}
        <button onclick="Dari.loadData()" style="margin-top:16px;padding:10px 22px;border:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);cursor:pointer;font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;">Reintentar</button>
      </div>
    `;
    showToast(message, 'error');
  }

  /* ---------- LIGHTBOX ---------- */
  let currentScale = 1, translateX = 0, translateY = 0, isDragging = false;
  let startX, startY, startTranslateX, startTranslateY;
  function openLightbox(src, alt) {
    if (!src || src === CONFIG.defImg) return;
    const highRes = src.replace(/&sz=w\d+/, '&sz=w1200');
    lightboxImg.src = highRes; lightboxImg.alt = alt || 'Joya';
    resetZoom(); lightbox.classList.add('show'); document.body.style.overflow = 'hidden';
  }
  function closeLightbox() { lightbox.classList.remove('show'); document.body.style.overflow = ''; resetZoom(); }
  function resetZoom() {
    currentScale = 1; translateX = 0; translateY = 0;
    lightboxImg.style.transform = 'scale(1) translate(0px,0px)';
    lightboxImg.classList.remove('zoomed'); lightbox.style.cursor = 'zoom-out';
  }
  lightbox.addEventListener('click', e => { if (e.target === lightbox || e.target === lightboxInner || e.target === lightboxImg) closeLightbox(); });
  lightboxClose.addEventListener('click', e => { e.stopPropagation(); closeLightbox(); });
  // Escape cierra los tres modales; closeShare se sumó para el flyer.
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeLightbox(); closeCartModal(); closeShare(); } });
  lightboxImg.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.08 : 0.08;
    let newScale = Math.min(3, Math.max(0.5, currentScale + delta));
    if (newScale !== currentScale) {
      currentScale = newScale;
      lightboxImg.style.transform = `scale(${currentScale}) translate(${translateX}px, ${translateY}px)`;
      lightboxImg.classList.toggle('zoomed', currentScale > 1);
      lightbox.style.cursor = currentScale > 1 ? 'zoom-in' : 'zoom-out';
    }
  }, { passive: false });
  lightboxImg.addEventListener('dblclick', e => {
    e.preventDefault();
    if (currentScale > 1) resetZoom();
    else { currentScale = 1.5; lightboxImg.style.transform = 'scale(1.5) translate(0,0)'; lightboxImg.classList.add('zoomed'); lightbox.style.cursor = 'zoom-in'; }
  });
  lightboxImg.addEventListener('mousedown', e => {
    if (currentScale <= 1) return;
    isDragging = true; startX = e.clientX; startY = e.clientY;
    startTranslateX = translateX; startTranslateY = translateY;
    lightboxImg.style.cursor = 'grabbing'; e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!isDragging) return;
    translateX = startTranslateX + (e.clientX - startX);
    translateY = startTranslateY + (e.clientY - startY);
    lightboxImg.style.transform = `scale(${currentScale}) translate(${translateX}px, ${translateY}px)`;
  });
  document.addEventListener('mouseup', () => { isDragging = false; lightboxImg.style.cursor = currentScale > 1 ? 'zoom-in' : 'zoom-out'; });

  /* ---------- BÚSQUEDA ---------- */
  function openSearch() { searchExpand.classList.add('open'); searchInput.focus(); }
  function closeSearch() { searchExpand.classList.remove('open'); searchInput.value = ''; searchQuery = ''; renderProducts(); renderCarousel(); }
  searchToggle.addEventListener('click', e => { e.stopPropagation(); if (searchExpand.classList.contains('open')) closeSearch(); else openSearch(); });
  searchClose.addEventListener('click', e => { e.stopPropagation(); closeSearch(); });
  document.addEventListener('click', e => { const inside = searchExpand.contains(e.target) || searchToggle.contains(e.target); if (!inside && searchExpand.classList.contains('open')) closeSearch(); });
  const handleSearch = debounce(function() { searchQuery = searchInput.value.toLowerCase().trim(); renderProducts(); renderCarousel(); }, 200);
  searchInput.addEventListener('input', handleSearch);
  searchInput.addEventListener('keydown', e => { if (e.key === 'Escape') closeSearch(); });

  /* ---------- FAVORITOS ---------- */
  function isFavorite(id) { return favorites.includes(id); }
  function heartIcon(filled) {
    return `<svg viewBox="0 0 24 24" aria-hidden="true" fill="${filled ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 20.3 4.7 13a4.7 4.7 0 0 1 6.6-6.7l.7.7.7-.7A4.7 4.7 0 0 1 19.3 13Z"/></svg>`;

  function toggleFavorite(pid) {
    const i = favorites.indexOf(pid);
    if (i >= 0) { favorites.splice(i,1); showToast('Eliminado de favoritos'); } else { favorites.push(pid); showToast('Añadido a favoritos','success'); }

  /* ---------- CATEGORÍAS ---------- */
  function renderCategories() {
    const types = ["TODOS", ...new Set(inventory.map(p => p.type).filter(Boolean))];
    const list = inventory.some(hasOffer) ? ["TODOS", "OFERTAS", ...types.slice(1)] : types;

  /* ---------- CANTIDAD ---------- */
  function changeQty(pid, delta) {
    const input = document.getElementById('qty-'+pid);
    const p = inventory.find(x => x.id === pid);
    if (!input || !p) return;
    let v = parseInt(input.value) || 1;
    v = Math.max(1, Math.min(v + delta, p.stock));
    input.value = v; updateAddBtn(pid, v, p.stock);
  }
  function handleQtyInput(pid) {
    const input = document.getElementById('qty-'+pid);
    const p = inventory.find(x => x.id === pid);
    if (!input || !p) return;
    let v = parseInt(input.value);
    if (isNaN(v) || v < 1) v = 1;
    if (v > p.stock) v = p.stock;
    input.value = v; updateAddBtn(pid, v, p.stock);
  }
  function updateAddBtn(pid, qty, stock) {
    const btn = document.getElementById('add-btn-'+pid);
    if (btn) btn.disabled = qty > stock || stock <= 0;
  }

  /* ==========================================================
     CARRUSEL DE OFERTAS (abanico fluido)
     - Arrastre real con el dedo / mouse
     - Transiciones CSS: se pueden interrumpir y encadenar
     - Sin bloqueos: los clics rápidos nunca se pierden
     ========================================================== */
  let carouselProducts = [];
  let fanEls = [];
  let fanIndex = 0;
  let fanVisibleCount = 5;
  let fanDrag = null;
  let fanMoved = false;
  let fanSwipeBlock = false;
  let fanSwipeTimer = null;
  let fanResizeTimer = null;
  let fanLastWidth = window.innerWidth;
  const FAN_DRAG_THRESHOLD = 38;

  function fanMetrics(){
    const w = window.innerWidth;
    if (w < 480)  return { cw:150, visible:3, angle:1.2, spread:.98, drop:.04 };
    if (w < 900)  return { cw:172, visible:5, angle:1.2, spread:.98, drop:.04 };
    if (w < 1280) return { cw:190, visible:5, angle:1.5, spread:.98, drop:.03 };
    return         { cw:210, visible:7, angle:1.5, spread:.92, drop:.03 };
  }

  function fanHalf(){ return Math.floor(fanMetrics().visible / 2); }

  /* Posición relativa al centro (circular cuando hay más piezas que huecos) */
  function fanOffset(i){
    const total = carouselProducts.length;
    const m = fanMetrics();
    if (total <= m.visible) return i - (total - 1) / 2;
    let d = (i - fanIndex) % total;
    if (d < 0) d += total;
    if (d > total / 2) d -= total;
    return d;
  }

  function layoutFan(){
    const total = carouselProducts.length;
    if (!total) return;
    const m = fanMetrics();
    const half = Math.max(fanHalf(), 1);

    fanEls.forEach(el => {
      const d = fanOffset(+el.dataset.index);
      const ad = Math.abs(d);
      const hidden = ad > half + 0.001;
      const norm = Math.min(ad / half, 1);
      const x = d * m.cw * m.spread;
      const y = norm * norm * m.cw * m.drop;
      const rot = (d / half) * m.angle;
      const scale = Math.max(.6, 1 - .08 * ad);

      el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) rotate(' + rot.toFixed(2) + 'deg) scale(' + scale.toFixed(3) + ')';
      el.style.opacity = hidden ? '0' : '1';
      el.style.zIndex = hidden ? '0' : String(40 - Math.round(ad * 6));
      el.style.pointerEvents = hidden ? 'none' : 'auto';
    });
  }

  function applyFanSize(){
    const m = fanMetrics();
    document.documentElement.style.setProperty('--fan-cw', m.cw + 'px');
    const el = fanEls[fanIndex] || fanEls[0];
    const cardH = el ? el.offsetHeight : Math.round(m.cw * 1.85);
    fanStage.style.height = Math.ceil(cardH + m.cw * m.drop + 48) + 'px';
  }

  function fanCardHtml(p, i){
    const imgSrc = fixDriveUrl(p.img, 500);
    const altSrc = driveAltUrl(imgSrc, 500);
    const isOffer = hasOffer(p);
    const out = p.stock <= 0;
    const low = p.stock > 0 && p.stock <= 5;

    const priceHtml = isOffer
      ? `<span class="fan-card-price-old">${formatPrice(p.price)}</span><span class="fan-card-price-offer">${formatPrice(p.oferta)}</span>`
      : `<span class="fan-card-price">${formatPrice(p.price)}</span>`;

    return `
      <article class="fan-card ${isOffer ? 'offer' : ''}" data-index="${i}">
        <div class="fan-card-img">
          <img src="${imgSrc}" ${altSrc ? `data-alt="${altSrc}"` : ''} alt="${sanitize(p.name)}" loading="lazy" decoding="async"
               onerror="Dari.imgFallback(this)">
          ${isOffer ? `<span class="fan-card-badge">${discountLabel(p)}</span>` : ''}
          ${out ? '<span class="fan-card-stock">Vendido</span>'
                : low ? `<span class="fan-card-stock low">Solo ${p.stock}</span>` : ''}
        </div>
        <div class="fan-card-body">
          <span class="fan-card-type">${sanitize(p.type)}</span>
          <h3 class="fan-card-name">${sanitize(p.name)}</h3>
          <div class="fan-card-prices">${priceHtml}</div>
          <button type="button" class="fan-card-add" data-add-index="${i}" ${out ? 'disabled' : ''}>
            ${out ? 'Vendido' : 'Añadir'}
          </button>
        </div>
      </article>`;
  }

  function buildFan(items){
    carouselProducts = items;
    const total = items.length;
    const m = fanMetrics();
    fanVisibleCount = m.visible;
    fanIndex = 0;

    fanTrack.innerHTML = items.map((p, i) => fanCardHtml(p, i)).join('');
    fanEls = Array.from(fanTrack.querySelectorAll('.fan-card'));

    applyFanSize();
    buildFanDots();
    fanControls.style.display = total > 1 ? 'flex' : 'none';

    /* Posicionamiento inmediato, sin animación de entrada (nunca queda en blanco) */
    fanEls.forEach(el => { el.style.transition = 'none'; });
    layoutFan();
    void fanTrack.offsetWidth;
    fanEls.forEach(el => { el.style.transition = ''; });
  }

  function buildFanDots(){
    const total = carouselProducts.length;
    if (total <= 1){ fanDots.innerHTML = ''; return; }
    if (total <= 16){
      fanDots.innerHTML = carouselProducts.map((_, i) =>
        `<button type="button" class="fan-dot ${i === fanIndex ? 'active' : ''}" data-index="${i}" aria-label="Ver oferta ${i + 1}"></button>`
      ).join('');
      fanDots.querySelectorAll('.fan-dot').forEach(d => {
        d.addEventListener('click', () => fanGoTo(+d.dataset.index));
      });
      updateFanDots(false);
    } else {
      fanDots.innerHTML = `<span class="fan-counter">${fanIndex + 1} / ${total}</span>`;
    }
  }

  function updateFanDots(smooth){
    const total = carouselProducts.length;
    if (total <= 1) return;
    if (total <= 16){
      fanDots.querySelectorAll('.fan-dot').forEach((d, i) => d.classList.toggle('active', i === fanIndex));
      const act = fanDots.querySelector('.fan-dot.active');
      if (act && smooth !== false){
        fanDots.scrollTo({ left: act.offsetLeft - fanDots.clientWidth / 2 + act.offsetWidth / 2, behavior: 'smooth' });
      }
    } else {
      const c = fanDots.querySelector('.fan-counter');
      if (c) c.textContent = `${fanIndex + 1} / ${total}`;
    }
  }

  function fanStep(dir){
    const total = carouselProducts.length;
    if (total <= 1) return;
    fanIndex = ((fanIndex + dir) % total + total) % total;
    updateFanDots();
    layoutFan();
  }

  function fanGoTo(i){
    const total = carouselProducts.length;
    if (total <= 1) return;
    fanIndex = ((i % total) + total) % total;
    updateFanDots();
    layoutFan();
  }

  /* ---- Arrastre ---- */
  function fanDragStart(e){
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest('button')) return;
    fanDrag = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, axis: null };
    fanMoved = false;
    fanStage.classList.add('dragging');
    try { fanStage.setPointerCapture(e.pointerId); } catch (err) {}
  }

  function fanDragMove(e){
    if (!fanDrag || e.pointerId !== fanDrag.id) return;
    const dx = e.clientX - fanDrag.x;
    const dy = e.clientY - fanDrag.y;

    if (fanDrag.axis === null){
      if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
      if (Math.abs(dy) > Math.abs(dx)){
        fanDrag = null;
        fanStage.classList.remove('dragging');
        fanTrack.style.transform = '';
        return;
      }
      fanDrag.axis = 'x';
    }

    const limit = Math.max(130, fanStage.clientWidth * .38);
    const eased = dx / (1 + Math.abs(dx) / (limit * 3));
    fanDrag.dx = eased;
    fanTrack.style.transform = 'translate3d(' + eased.toFixed(1) + 'px,0,0)';
    if (Math.abs(dx) > 8) fanMoved = true;
  }

  function fanDragEnd(e){
    if (!fanDrag) return;
    if (e && e.pointerId !== undefined && e.pointerId !== fanDrag.id) return;
    const dx = fanDrag.dx || 0;
    fanDrag = null;

    fanStage.classList.remove('dragging');
    void fanTrack.offsetWidth;
    fanTrack.style.transform = '';

    if (Math.abs(dx) > FAN_DRAG_THRESHOLD){
      const steps = Math.min(3, Math.max(1, Math.round(Math.abs(dx) / 110)));
      fanStep(dx < 0 ? steps : -steps);
    }
    if (fanMoved){
      fanSwipeBlock = true;
      clearTimeout(fanSwipeTimer);
      fanSwipeTimer = setTimeout(() => { fanSwipeBlock = false; }, 320);
    }
  }

  fanStage.addEventListener('pointerdown', fanDragStart);
  fanStage.addEventListener('pointermove', fanDragMove);
  fanStage.addEventListener('pointerup', fanDragEnd);
  fanStage.addEventListener('pointercancel', () => {
    fanDrag = null;
    fanStage.classList.remove('dragging');
    fanTrack.style.transform = '';
  });
  fanStage.addEventListener('dragstart', e => e.preventDefault());
  fanStage.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight'){ e.preventDefault(); fanStep(1); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); fanStep(-1); }
  });

  fanTrack.addEventListener('click', e => {
    if (fanSwipeBlock) return;

    const addBtn = e.target.closest('.fan-card-add');
    if (addBtn){
      e.stopPropagation();
      const idx = parseInt(addBtn.dataset.addIndex, 10);
      if (!isNaN(idx)) addOneFromCarouselByIndex(idx);
      return;
    }

    const card = e.target.closest('.fan-card');
    if (!card) return;
    const idx = parseInt(card.dataset.index, 10);
    if (isNaN(idx)) return;
    const p = carouselProducts[idx];
    if (!p) return;

    if (carouselProducts.length > fanVisibleCount && idx !== fanIndex){ fanGoTo(idx); return; }
    openLightbox(fixDriveUrl(p.img, 1200), p.name);
  });

  fanPrev.addEventListener('click', () => fanStep(-1));
  fanNext.addEventListener('click', () => fanStep(1));

  window.addEventListener('resize', () => {
    clearTimeout(fanResizeTimer);
    fanResizeTimer = setTimeout(() => {
      if (!carouselProducts.length) return;
      if (Math.abs(window.innerWidth - fanLastWidth) < 10) return;
      fanLastWidth = window.innerWidth;
      const m = fanMetrics();
      if (m.visible !== fanVisibleCount){
        fanVisibleCount = m.visible;
        buildFanDots();
      }
      applyFanSize();
      layoutFan();
    }, 180);
  });

  function renderCarousel(){
    const show = (currentCategory === 'TODOS' && searchQuery === '');
    const offerItems = inventory.filter(p => hasOffer(p) && p.stock > 0);

    if (!show || !offerItems.length){
      carouselWrapper.classList.remove('show');
      carouselProducts = [];
      fanEls = [];
      fanTrack.innerHTML = '';
      return;
    }

    carouselWrapper.classList.add('show');
    carouselTitle.textContent = tituloOferta || 'Ofertas';
    carouselSub.textContent = offerItems.length + (offerItems.length === 1 ? ' pieza con descuento' : ' piezas con descuento');
    buildFan(offerItems);
  }

  /* ---------- RENDER PRODUCTOS ---------- */
  function updateGridHead(count){
    if (gridTitle) {
      gridTitle.textContent = searchQuery ? 'Resultados'
        : currentCategory === 'TODOS' ? 'Catálogo'
        : currentCategory === 'OFERTAS' ? 'Ofertas'
        : currentCategory;

    if (gridCount) gridCount.textContent = count === 1 ? '1 pieza' : count + ' piezas';
  }

  function renderProducts() {
    let list = inventory;
    if (currentCategory === 'OFERTAS') list = inventory.filter(hasOffer);
    else if (currentCategory !== 'TODOS') list = inventory.filter(p => p.type === currentCategory);
    if (searchQuery) {
      list = list.filter(p => (p.name && p.name.toLowerCase().includes(searchQuery)) ||
                              (p.type && p.type.toLowerCase().includes(searchQuery)) ||
                              (p.id && p.id.toLowerCase().includes(searchQuery)));
    }
    updateGridHead(list.length);
    if (!list.length) {
      grid.innerHTML = `<div class="empty-state"><div class="empty-icon">◇</div><p class="empty-text">${searchQuery?'No se encontraron resultados':'No hay productos en esta categoría'}</p></div>`;
      return;
    }
    let html = '';
    list.forEach((p) => { html += createProductCardHtml(p); });
    grid.innerHTML = html;

      if (inp) updateAddBtn(p.id, parseInt(inp.value)||1, p.stock);

  function createProductCardHtml(p) {
    const out = p.stock <= 0, low = p.stock > 0 && p.stock <= 5;

    const imgSrc = fixDriveUrl(p.img, 400);
    const altSrc = driveAltUrl(imgSrc, 400);
    const nameEnc = encodeURIComponent(p.name);
    const idEnc = encodeURIComponent(p.id);
    const isOffer = hasOffer(p);
    const offerClass = isOffer ? 'offer' : '';
    const badgeOffer = isOffer ? `<div class="offer-badge">${discountLabel(p)}</div>` : '';

    let priceHtml = isOffer
      ? `<span class="original-price">${formatPrice(p.price)}</span><span class="offer-price">${formatPrice(p.oferta)}</span>`
      : `<span class="card-price">${formatPrice(p.price)}</span>`;

    const bodyHtml = `
      <div class="card-body">
        <p class="card-type">${sanitize(p.type)}</p>

        <div class="card-price-row">

          <div class="qty-control">
            <button class="qty-btn" onclick="Dari.changeQty('${idEnc}',-1)" ${out?'disabled':''}>–</button>

                   oninput="Dari.handleQtyInput('${idEnc}')" ${out?'disabled':''}>
            <button class="qty-btn" onclick="Dari.changeQty('${idEnc}',1)" ${out?'disabled':''}>+</button>
          </div>
        </div>
        <button id="add-btn-${p.id}" class="add-btn" onclick="Dari.addToCart('${idEnc}')" ${out?'disabled':''}>${out?'Vendido':'Añadir'}</button>
      </div>
    `;

    const extraHtml = `
      <button id="fav-${p.id}" class="fav-btn ${fav?'is-fav':''}" aria-label="${fav?'Quitar de favoritos':'Añadir a favoritos'}" aria-pressed="${fav}" onclick="event.stopPropagation();Dari.toggleFavorite('${idEnc}')">${heartIcon(fav)}</button>
      ${!out ? `<button class="share-btn" onclick="event.stopPropagation();Dari.openShare('${idEnc}')" aria-label="Compartir ${sanitize(p.name)}">

      </button>` : ''}
      ${out ? '<span class="stock-badge">Vendido</span>' : low ? `<span class="stock-badge low">Solo ${p.stock}</span>` : ''}

    const cardClass = `card ${offerClass} card-enter`;

  /* ---------- CARRITO ---------- */

  /* Añade un producto al carrito con el PRECIO EFECTIVO (oferta si aplica) */
  function pushCartItem(p, qty){
    const price = effectivePrice(p);
    const exist = cart.find(i => i.id === p.id);
    if (exist) {
      if (exist.q + qty > p.stock) { showToast('Máximo '+p.stock,'error'); return false; }
      exist.q += qty;
      exist.price = price;
      exist.name = p.name;
    } else {
      cart.push({ id: p.id, name: p.name, price: price, q: qty });
    }
    updateCartBar(); saveState(); showToast('Añadido al carrito','success');
    cartBadge.classList.remove('bounce'); void cartBadge.offsetWidth; cartBadge.classList.add('bounce');
    return true;
  }

  function addToCart(pid) {
    const p = inventory.find(x => x.id === pid);
    if (!p || p.stock <= 0) return;
    const qty = parseInt(document.getElementById('qty-'+pid).value) || 1;
    if (qty > p.stock) { showToast('Solo hay '+p.stock+' unidades','error'); return; }
    pushCartItem(p, qty);
  }

  function addOneFromCarouselByIndex(idx) {
    const p = carouselProducts[idx];
    if (!p) { showToast('Producto no encontrado','error'); return; }
    if (p.stock <= 0) { showToast('Sin stock','error'); return; }
    pushCartItem(p, 1);
  }

  function addOneFromCarousel(pid) {
    const p = inventory.find(x => x.id === pid);
    if (!p) { showToast('Producto no encontrado','error'); return; }
    if (p.stock <= 0) { showToast('Sin stock','error'); return; }
    pushCartItem(p, 1);
  }

  function updateCartBar() {
    const total = cart.reduce((s,i) => s + i.q, 0);
    cartBadge.textContent = total > 9 ? '9+' : String(total);
    cartBadge.classList.toggle('show', total > 0);
    renderCartModal();
  }

  function renderCartModal() {
    if (!cart.length) {
      cartModalItems.innerHTML = `<div class="empty-state" style="padding:36px 0"><div class="empty-icon">—</div><p class="empty-text">Tu pedido está vacío</p></div>`;
      modalTotal.textContent = '$0'; return;
    }
    let total = 0, html = '';
    cart.forEach((item, idx) => {
      total += item.price * item.q;
      const p = inventory.find(x => x.id === item.id);
      // Mostrar precio normal tachado si el artículo se agregó con precio de oferta
      let priceLine = `${formatPrice(item.price)} c/u`;
      if (p && hasOffer(p) && Number(p.oferta) === Number(item.price) && Number(p.price) > Number(p.oferta)) {
        priceLine = `<span class="old">${formatPrice(p.price)}</span><span class="off">${formatPrice(item.price)} c/u</span>`;
      }
      html += `
      <div class="cart-item">
        ${p ? `<img class="cart-item-thumb" src="${fixDriveUrl(p.img, 120)}" alt="" loading="lazy" onerror="Dari.imgFallback(this)">` : ''}
        <div class="cart-item-info">
          <div class="cart-item-name">${sanitize(item.name)}</div>
          <div class="cart-item-price">${priceLine}</div>
        </div>
        <div class="cart-item-actions">
          <div class="cart-qty">
            <button class="cart-qty-btn" onclick="Dari.updateCartItemQty(${idx},-1)">−</button>
            <input type="number" class="cart-qty-input" value="${item.q}" min="1" oninput="Dari.updateCartItemQty(${idx},0,true)" id="cart-qty-${idx}">
            <button class="cart-qty-btn" onclick="Dari.updateCartItemQty(${idx},1)">+</button>
          </div>
          <button class="cart-delete" onclick="Dari.removeCartItem(${idx})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>
        </div>
      </div>`;
    });
    cartModalItems.innerHTML = html;
    modalTotal.textContent = formatPrice(total);

  function updateCartItemQty(idx, delta, fromInput) {
    const item = cart[idx];
    if (!item) return;
    const p = inventory.find(x => x.id === item.id);
    if (!p) return;
    let q = fromInput ? parseInt(document.getElementById('cart-qty-'+idx).value) : item.q + delta;
    if (isNaN(q) || q < 1) q = 1;
    if (p.stock && q > p.stock) { showToast('Máximo '+p.stock,'error'); q = p.stock; }
    item.q = q;
    // Mantener el precio actualizado según oferta vigente
    item.price = effectivePrice(p);
    updateCartBar(); saveState();
  }

  function removeCartItem(idx) {
    const name = cart[idx]?.name || 'Producto';
    cart.splice(idx, 1);
    updateCartBar(); saveState(); showToast(name + ' eliminado');
    if (!cart.length) closeCartModal();
